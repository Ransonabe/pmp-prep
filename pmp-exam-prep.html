<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Banco PMP — Preparación de examen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1D33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMP Prep">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1D33;
    --ink-2:#182C4C;
    --ink-3:#213A63;
    --grid:#2E4771;
    --paper:#ECEFF3;
    --paper-2:#F7F8FA;
    --amber:#E8A33D;
    --amber-dim:#8a672c;
    --verified:#3FA796;
    --alert:#E2574C;
    --text-on-ink:#EDF1F7;
    --text-on-ink-dim:#9FB0CC;
    --text-on-paper:#132038;
    --text-on-paper-dim:#4A5872;
    --people:#C97BB0;
    --process:#4FA3D1;
    --business:#E8A33D;
    --radius:2px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Source Serif 4',serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--text-on-ink);
    font-family:var(--font-body);
    min-height:100vh;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    background-position: center;
  }
  #app{max-width:920px; margin:0 auto; padding:20px 16px 64px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0 22px; border-bottom:1px solid var(--grid); margin-bottom:24px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    color:var(--amber); border:1px solid var(--amber-dim); padding:3px 6px;
  }
  .brand h1{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:.01em;}
  .nav-btn{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.05em;
    background:none; border:1px solid var(--grid); color:var(--text-on-ink-dim);
    padding:8px 12px; cursor:pointer; border-radius:var(--radius);
    transition:border-color .15s, color .15s;
  }
  .nav-btn:hover{border-color:var(--amber); color:var(--text-on-ink);}
  .nav-btn:focus-visible, button:focus-visible, select:focus-visible, .option:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }

  /* ---------- Blueprint corner card ---------- */
  .plate{
    position:relative; background:var(--ink-2); border:1px solid var(--grid);
    padding:22px; margin-bottom:18px;
  }
  .plate::before, .plate::after{
    content:""; position:absolute; width:10px; height:10px;
    border-color:var(--amber); border-style:solid;
  }
  .plate::before{top:-1px; left:-1px; border-width:2px 0 0 2px;}
  .plate::after{bottom:-1px; right:-1px; border-width:0 2px 2px 0;}

  /* ---------- Dashboard ---------- */
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber); margin-bottom:8px; display:block;
  }
  h2{font-family:var(--font-display); font-size:22px; font-weight:600; margin-bottom:4px;}
  .sub{color:var(--text-on-ink-dim); font-size:14px; margin-bottom:18px; max-width:60ch;}

  .coverage{margin-top:6px;}
  .coverage-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .coverage-label{
    font-family:var(--font-mono); font-size:11.5px; width:190px; flex-shrink:0;
    color:var(--text-on-ink-dim); display:flex; justify-content:space-between; gap:8px;
  }
  .coverage-label b{color:var(--text-on-ink); font-weight:600;}
  .coverage-track{
    flex:1; height:14px; background:var(--ink); border:1px solid var(--grid); position:relative; overflow:hidden;
  }
  .coverage-track .weight{
    position:absolute; top:0; bottom:0; left:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px);
  }
  .coverage-fill{position:absolute; top:0; bottom:0; left:0; transition:width .5s ease;}
  .coverage-pct{font-family:var(--font-mono); font-size:11.5px; width:38px; text-align:right; color:var(--text-on-ink-dim);}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
  .stat{border:1px solid var(--grid); padding:12px; text-align:center;}
  .stat .n{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .stat .l{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-on-ink-dim); margin-top:2px;}

  .mode-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-top:18px;}
  @media (max-width:760px){.mode-grid{grid-template-columns:1fr;} .stat-grid{grid-template-columns:1fr 1fr 1fr;} .coverage-label{width:130px; font-size:10.5px;}}
  .mode-card.secondary{background:var(--ink-2);}
  .back-link{font-family:var(--font-mono); font-size:12px; color:var(--text-on-ink-dim); background:none; border:none; cursor:pointer; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px;}
  .back-link:hover{color:var(--amber);}
  .history-empty{color:var(--text-on-ink-dim); font-size:14px; padding:20px 0;}
  .domain-breakdown{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .domain-breakdown span{font-family:var(--font-mono); font-size:10.5px; padding:3px 8px; border:1px solid var(--grid); border-radius:20px; color:var(--text-on-ink-dim);}
  .mode-card{
    background:var(--ink); border:1px solid var(--grid); padding:18px; cursor:pointer; text-align:left;
    transition:border-color .15s, transform .15s;
  }
  .mode-card:hover{border-color:var(--amber); transform:translateY(-1px);}
  .mode-card h3{font-family:var(--font-display); font-size:16px; margin-bottom:6px;}
  .mode-card p{font-size:13px; color:var(--text-on-ink-dim); line-height:1.5;}
  .mode-card .tag{font-family:var(--font-mono); font-size:10px; color:var(--amber); letter-spacing:.08em; margin-bottom:8px; display:block;}

  .field-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;}
  .field{flex:1; min-width:150px;}
  .field label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-on-ink-dim); display:block; margin-bottom:6px;}
  select{
    width:100%; background:var(--ink); border:1px solid var(--grid); color:var(--text-on-ink);
    font-family:var(--font-mono); font-size:13px; padding:9px 10px; border-radius:var(--radius);
  }
  .primary-btn{
    font-family:var(--font-display); font-weight:600; font-size:14px; letter-spacing:.02em;
    background:var(--amber); color:var(--ink); border:none; padding:12px 20px; cursor:pointer;
    margin-top:16px; transition:filter .15s;
  }
  .primary-btn:hover{filter:brightness(1.08);}
  .ghost-btn{
    font-family:var(--font-mono); font-size:12px; background:none; border:1px solid var(--grid);
    color:var(--text-on-ink-dim); padding:10px 16px; cursor:pointer; margin-top:16px; margin-left:10px;
  }
  .ghost-btn:hover{color:var(--text-on-ink); border-color:var(--amber);}

  /* ---------- Question view ---------- */
  .qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .qmeta-left{display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-on-ink-dim);}
  .domain-pill{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; color:var(--ink); font-weight:600;
  }
  .timer{font-family:var(--font-mono); font-size:13px; color:var(--amber);}
  .progress-bar{height:3px; background:var(--grid); margin-bottom:22px; position:relative;}
  .progress-bar i{position:absolute; top:0; left:0; bottom:0; background:var(--amber); transition:width .2s;}

  .qtext{font-family:var(--font-body); font-size:17px; line-height:1.6; margin-bottom:20px; color:var(--text-on-ink);}
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    background:var(--ink); border:1px solid var(--grid); color:var(--text-on-ink);
    padding:13px 14px; cursor:pointer; font-family:var(--font-body); font-size:15px; line-height:1.5;
    transition:border-color .15s, background .15s;
  }
  .option:hover:not(:disabled){border-color:var(--amber);}
  .option .k{
    font-family:var(--font-mono); font-weight:600; font-size:12px; color:var(--text-on-ink-dim);
    border:1px solid var(--grid); width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }
  .option.selected{border-color:var(--amber); background:var(--ink-3);}
  .option.correct{border-color:var(--verified); background:rgba(63,167,150,.14);}
  .option.correct .k{border-color:var(--verified); background:var(--verified); color:var(--ink);}
  .option.incorrect{border-color:var(--alert); background:rgba(226,87,76,.12);}
  .option.incorrect .k{border-color:var(--alert); background:var(--alert); color:var(--ink);}
  .option:disabled{cursor:default;}

  .explain{
    margin-top:18px; padding:16px 18px; background:var(--paper); color:var(--text-on-paper);
    border-left:4px solid var(--verified); font-size:14.5px; line-height:1.6;
  }
  .explain.wrong-flag{border-left-color:var(--alert);}
  .explain b{font-family:var(--font-display); font-size:12px; letter-spacing:.05em; text-transform:uppercase; display:block; margin-bottom:6px;}
  .explain .verdict-ok{color:#1F7A6C;}
  .explain .verdict-bad{color:#B23A30;}

  .qfooter{display:flex; justify-content:space-between; align-items:center; margin-top:22px;}

  /* ---------- Results ---------- */
  .score-hero{text-align:center; padding:30px 10px;}
  .score-hero .big{font-family:var(--font-mono); font-size:52px; font-weight:600; color:var(--amber);}
  .score-hero .big small{font-size:20px; color:var(--text-on-ink-dim);}
  .score-hero p{color:var(--text-on-ink-dim); margin-top:6px; font-size:13px;}
  .review-item{border:1px solid var(--grid); padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .review-item:hover{border-color:var(--amber);}
  .review-item .row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .review-item .q{font-size:14px; color:var(--text-on-ink); flex:1;}
  .review-item .verdict{font-family:var(--font-mono); font-size:11px; padding:2px 8px; flex-shrink:0;}
  .verdict.ok{color:var(--verified); border:1px solid var(--verified);}
  .verdict.bad{color:var(--alert); border:1px solid var(--alert);}
  .review-detail{display:none; margin-top:14px;}
  .review-item.open .review-detail{display:block;}

  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .chip{
    font-family:var(--font-mono); font-size:11.5px; border:1px solid var(--grid); background:none;
    color:var(--text-on-ink-dim); padding:6px 12px; cursor:pointer; border-radius:20px;
  }
  .chip.active{border-color:var(--amber); color:var(--amber);}

  footer.credit{
    text-align:center; margin-top:36px; font-family:var(--font-mono); font-size:10.5px;
    color:var(--text-on-ink-dim); letter-spacing:.04em;
  }
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">PMP · 001</span>
      <h1>Banco de preguntas PMP</h1>
    </div>
    <button class="nav-btn" id="homeBtn">Panel</button>
  </div>
  <div id="view"></div>
  <footer class="credit">BASADO EN PMBOK® 7ª ED. · EXAM CONTENT OUTLINE PMI · AGILE PRACTICE GUIDE — CONTENIDO ORIGINAL, NO OFICIAL DE PMI</footer>
</div>

<script>
/* ============================================================
   BANCO DE PREGUNTAS
   Cada pregunta: { id, domain: 'people'|'process'|'business', topic, q, o:[4], a:index, e:explicación }
   ============================================================ */
const QUESTIONS = [
// ---- DOMINIO: PERSONAS (Conflicto y liderazgo) ----
{id:'p01', domain:'people', topic:'Gestión de conflictos', q:'Durante un sprint, dos desarrolladores discuten de forma cada vez más tensa sobre qué enfoque técnico usar, y esto empieza a afectar el ambiente del equipo. ¿Qué debería hacer primero el director de proyecto?',
 o:['Escalar el conflicto al patrocinador para que decida el enfoque técnico','Facilitar una conversación directa y privada entre ambos para que colaboren en una solución conjunta','Imponer su propia decisión técnica para cortar la discusión de raíz','Esperar a la retrospectiva del sprint para tratarlo con todo el equipo'],
 a:1, e:'La guía del PMBOK favorece resolver el conflicto en el nivel más bajo posible y lo antes posible, usando el modo colaborar/resolver problemas de Thomas-Kilmann. El director de proyecto facilita, no impone ni delega la decisión, y no debe dejar que el conflicto se enquiste hasta la retrospectiva.'},
{id:'p02', domain:'people', topic:'Gestión de conflictos', q:'¿Qué técnica de resolución de conflictos se considera generalmente la más efectiva porque busca una solución en la que ambas partes queden satisfechas (ganar-ganar)?',
 o:['Retirarse/Evitar (Withdraw/Avoid)','Suavizar/Adaptarse (Smooth/Accommodate)','Colaborar/Resolver el problema (Collaborate/Problem Solve)','Forzar/Dirigir (Force/Direct)'],
 a:2, e:'Colaborar/Resolver el problema integra distintos puntos de vista y perspectivas mediante una actitud cooperativa y un diálogo abierto, produciendo un consenso y compromiso genuino de ambas partes. Es la técnica preferida cuando el tiempo lo permite, frente a las demás que suelen dejar a alguna parte insatisfecha.'},
{id:'p03', domain:'people', topic:'Gestión de conflictos', q:'Un conflicto entre dos miembros del equipo por diferencias de personalidad persiste después de varias conversaciones informales y empieza a afectar las entregas. ¿Cuál es el siguiente paso más apropiado?',
 o:['Ignorarlo, ya que los conflictos de personalidad se resuelven solos con el tiempo','Reasignar a una de las personas a otro proyecto de inmediato','Convocar una reunión estructurada de mediación, con reglas básicas claras y su rol como facilitador neutral','Documentar el conflicto en el registro de riesgos y no intervenir'],
 a:2, e:'Cuando el diálogo informal no basta, el director de proyecto debe pasar a una intervención más estructurada: mediar activamente, recordar las reglas básicas (ground rules) del equipo y buscar una solución conjunta antes de recurrir a medidas drásticas como la reasignación, que se reserva para conflictos graves y no resueltos.'},
{id:'p04', domain:'people', topic:'Gestión de conflictos', q:'El equipo detecta un defecto menor de estilo de código que no afecta la funcionalidad ni la fecha de entrega. El líder decide no dedicarle tiempo ahora y seguir con las tareas prioritarias. ¿Qué técnica de conflicto está aplicando?',
 o:['Forzar/Dirigir','Retirarse/Evitar','Comprometer/Conciliar','Colaborar/Resolver el problema'],
 a:1, e:'Retirarse/Evitar consiste en posponer o no abordar un conflicto de baja prioridad para preservar el tiempo y la relación del equipo. Es apropiado para temas triviales, pero no debe usarse como estrategia general porque no resuelve la causa raíz de conflictos importantes.'},
{id:'p05', domain:'people', topic:'Gestión de conflictos', q:'Durante una prueba en producción se detecta un riesgo inminente de seguridad. Un técnico quiere seguir el procedimiento estándar de cambios, pero el director de proyecto ordena detener el despliegue de inmediato por la urgencia. ¿Qué técnica de resolución de conflictos ejemplifica esta acción?',
 o:['Suavizar/Adaptarse','Comprometer/Conciliar','Forzar/Dirigir','Retirarse/Evitar'],
 a:2, e:'Forzar/Dirigir impone una postura a expensas de otras, típicamente desde una posición de autoridad. Se justifica en situaciones urgentes o críticas para la seguridad, donde no hay tiempo para un proceso colaborativo, aunque a largo plazo puede dañar la relación si se abusa de ella.'},
{id:'p06', domain:'people', topic:'Gestión de conflictos', q:'Dos interesados clave no logran ponerse de acuerdo sobre una prioridad de alcance y el plazo para decidir es hoy. Ambos ceden parcialmente en sus posiciones para llegar a un acuerdo aceptable, aunque ninguno obtiene todo lo que quería. ¿Qué técnica se está usando?',
 o:['Colaborar/Resolver el problema','Comprometer/Conciliar','Retirarse/Evitar','Forzar/Dirigir'],
 a:1, e:'Comprometer/Conciliar busca una solución que satisfaga parcialmente a todas las partes mediante concesiones mutuas. Se usa cuando el tiempo es limitado y las partes tienen poder similar; a diferencia de colaborar, no maximiza la satisfacción de nadie, es una solución de tipo «ganar algo-perder algo».'},
// ---- DOMINIO: PERSONAS (Liderazgo y construcción de equipo) ----
{id:'p07', domain:'people', topic:'Liderazgo', q:'Según el PMBOK 7ª edición, ¿cuál es la principal diferencia entre liderazgo y gestión (management) en el contexto de un proyecto?',
 o:['El liderazgo se centra en el corto plazo y la gestión en el largo plazo','La gestión dirige a las personas hacia objetivos usando autoridad posicional, mientras que el liderazgo inspira y motiva usando visión e influencia, con o sin autoridad formal','El liderazgo solo aplica a directores de proyecto certificados y la gestión a cualquier supervisor','No existe diferencia relevante; son términos intercambiables en la guía del PMBOK'],
 a:1, e:'El PMBOK distingue el liderazgo (influir, inspirar, motivar hacia una visión compartida, con independencia de la autoridad formal) de la gestión (planificar, organizar y controlar recursos usando la autoridad del puesto). Un director de proyecto eficaz combina ambos, pero el examen pide reconocer la diferencia conceptual.'},
{id:'p08', domain:'people', topic:'Liderazgo situacional', q:'Un equipo recién formado tiene alta motivación pero poca experiencia técnica en el dominio del proyecto. Según los modelos de liderazgo situacional, ¿qué estilo es más apropiado inicialmente?',
 o:['Delegar, dejando que el equipo decida sin supervisión','Dirigir, dando instrucciones claras y específicas con supervisión cercana','Apoyar, sin dar ninguna dirección concreta','Vender, sin verificar la comprensión de las tareas'],
 a:1, e:'Con baja competencia y alto compromiso, el liderazgo situacional recomienda un estilo directivo: instrucciones claras y supervisión estrecha, para construir competencia antes de pasar a estilos de venta/entrenamiento, apoyo y finalmente delegación a medida que el equipo madura.'},
{id:'p09', domain:'people', topic:'Construcción de equipo', q:'Según el modelo de Tuckman, un equipo que empieza a experimentar tensiones, desacuerdos sobre roles y cuestionamiento de la autoridad del líder se encuentra en la etapa de:',
 o:['Formación (Forming)','Conflicto (Storming)','Normalización (Norming)','Desempeño (Performing)'],
 a:1, e:'La etapa de Storming se caracteriza por conflictos de poder, cuestionamiento de roles y tensión mientras el equipo negocia cómo trabajar junto. Es una etapa natural y necesaria; el director de proyecto debe facilitarla, no evitarla, para que el equipo avance hacia Norming y Performing.'},
{id:'p10', domain:'people', topic:'Liderazgo servicial', q:'Un Scrum Master pasa gran parte de su tiempo eliminando impedimentos, protegiendo al equipo de interrupciones externas y asegurándose de que tengan lo que necesitan para autoorganizarse. ¿Qué estilo de liderazgo ejemplifica mejor esta conducta?',
 o:['Liderazgo transaccional','Liderazgo servicial (servant leadership)','Liderazgo autocrático','Liderazgo laissez-faire'],
 a:1, e:'El liderazgo servicial invierte la pirámide tradicional: el líder sirve al equipo eliminando obstáculos, facilitando la colaboración y poniendo las necesidades del equipo por delante de las propias. Es el estilo predominante recomendado en entornos ágiles según el Agile Practice Guide.'},
{id:'p11', domain:'people', topic:'Inteligencia emocional', q:'Un director de proyecto nota que está a punto de reaccionar con frustración ante una noticia negativa del equipo, y conscientemente hace una pausa para responder con calma en lugar de reaccionar impulsivamente. ¿Qué componente de la inteligencia emocional está demostrando principalmente?',
 o:['Empatía','Autorregulación','Habilidad social','Motivación intrínseca'],
 a:1, e:'La autorregulación es la capacidad de gestionar o redirigir impulsos y estados de ánimo disruptivos, pensando antes de actuar. Es distinta de la empatía (comprender las emociones ajenas) y permite al líder mantener la confianza del equipo incluso ante malas noticias.'},
{id:'p12', domain:'people', topic:'Motivación', q:'Según la teoría de motivación-higiene de Herzberg, ¿cuál de las siguientes opciones es un factor motivador (no simplemente higiénico) que aumenta la satisfacción real del equipo?',
 o:['Un salario competitivo','Condiciones seguras de trabajo','Reconocimiento por logros y oportunidades de crecimiento profesional','Políticas claras de la empresa'],
 a:2, e:'Herzberg distingue factores higiénicos (salario, condiciones, políticas) que evitan la insatisfacción pero no generan motivación real, de los factores motivadores (logro, reconocimiento, responsabilidad, crecimiento) que sí incrementan la satisfacción y el compromiso genuino del equipo.'},
{id:'p13', domain:'people', topic:'Motivación', q:'Un miembro del equipo pide constantemente tareas más desafiantes y oportunidades de aprender nuevas habilidades, aunque ya cumple con sus responsabilidades actuales. Según la jerarquía de necesidades de Maslow, esta persona probablemente está motivada por necesidades de:',
 o:['Seguridad','Fisiológicas','Autorrealización','Pertenencia'],
 a:2, e:'Buscar crecimiento, dominio de nuevas habilidades y alcanzar el propio potencial corresponde al nivel más alto de la pirámide de Maslow: autorrealización. Esto ocurre típicamente cuando las necesidades inferiores (fisiológicas, seguridad, pertenencia, estima) ya están cubiertas.'},
{id:'p14', domain:'people', topic:'Empoderamiento del equipo', q:'El equipo de desarrollo puede decidir por sí mismo cómo dividir el trabajo del sprint entre sus miembros, sin que el director de proyecto lo apruebe. ¿Qué principio ágil respalda directamente esta práctica?',
 o:['Los equipos autoorganizados generan la mejor arquitectura, requisitos y diseño','La documentación exhaustiva es más importante que el software funcionando','El cliente debe aprobar cada tarea individual antes de iniciarla','La jerarquía de mando debe mantenerse en todas las decisiones operativas'],
 a:0, e:'Uno de los principios del Manifiesto Ágil establece que las mejores arquitecturas, requisitos y diseños emergen de equipos autoorganizados. Empoderar al equipo para decidir el «cómo» del trabajo, dentro de los límites acordados, aumenta el compromiso, la calidad de las decisiones técnicas y la velocidad de entrega.'},
{id:'p15', domain:'people', topic:'Equipos de alto desempeño', q:'¿Cuál de las siguientes es la característica MÁS distintiva de un equipo de alto desempeño según la guía del PMBOK?',
 o:['Todos los miembros tienen exactamente el mismo nivel de experiencia técnica','El equipo depende totalmente de las instrucciones detalladas del director de proyecto para cada tarea','Existe confianza mutua, comunicación abierta y responsabilidad compartida por los resultados','El equipo nunca tiene desacuerdos internos'],
 a:2, e:'Los equipos de alto desempeño se caracterizan por confianza mutua, comunicación abierta, propiedad compartida de los resultados y capacidad de autogestión, no por la ausencia de desacuerdos (que son naturales y sanos) ni por la homogeneidad de habilidades.'},
// ---- DOMINIO: PERSONAS (Negociación y acuerdos) ----
{id:'p16', domain:'people', topic:'Negociación', q:'Durante la negociación de un contrato con un proveedor, el director de proyecto se centra en entender por qué el proveedor necesita un plazo de pago más corto, en lugar de simplemente rechazar la petición. ¿Qué enfoque de negociación está aplicando?',
 o:['Negociación basada en posiciones (posicional)','Negociación basada en intereses (principled negotiation)','Negociación distributiva de suma cero','Negociación por ultimátum'],
 a:1, e:'La negociación basada en intereses (método Harvard) busca entender las necesidades subyacentes de cada parte en lugar de aferrarse a posiciones fijas, permitiendo encontrar opciones de beneficio mutuo. Contrasta con la negociación posicional, centrada solo en «lo que cada parte pide».'},
{id:'p17', domain:'people', topic:'Negociación', q:'En una negociación difícil con un patrocinador sobre el alcance del proyecto, ¿cuál es la mejor práctica antes de entrar en la reunión?',
 o:['Improvisar la respuesta según lo que diga el patrocinador','Preparar su mejor alternativa a un acuerdo negociado (BATNA) y los intereses reales detrás de su postura','Aceptar de antemano cualquier condición para evitar el conflicto','Delegar toda la negociación en el patrocinador sin participar'],
 a:1, e:'Conocer el BATNA (Best Alternative To a Negotiated Agreement) y comprender los intereses reales -propios y de la otra parte- antes de negociar permite tomar decisiones informadas, saber cuándo aceptar un acuerdo y cuándo alejarse de la mesa.'},
{id:'p18', domain:'people', topic:'Negociación de acuerdos', q:'El equipo de proyecto y un proveedor externo firman un acuerdo de nivel de servicio (SLA) que define tiempos de respuesta claros. ¿Cuál es el principal beneficio de negociar y documentar este tipo de acuerdo desde el inicio?',
 o:['Elimina por completo la necesidad de gestionar riesgos con ese proveedor','Establece expectativas claras y reduce la ambigüedad que podría generar conflictos futuros','Garantiza legalmente que nunca habrá retrasos en el proyecto','Sustituye la necesidad de un contrato formal'],
 a:1, e:'Negociar acuerdos claros (SLA, contratos, cartas de acuerdo) al inicio de la relación establece expectativas compartidas sobre plazos, calidad y responsabilidades, reduciendo la probabilidad de malentendidos y conflictos, aunque no elimina otros riesgos del proyecto.'},
// ---- DOMINIO: PERSONAS (Interesados y colaboración) ----
{id:'p19', domain:'people', topic:'Compromiso de interesados', q:'Un interesado clave tiene alto poder sobre el proyecto pero actualmente muestra bajo interés y desconocimiento de sus objetivos. Según la matriz de poder-interés, ¿qué estrategia de compromiso es más adecuada?',
 o:['Monitorear con mínimo esfuerzo','Mantener satisfecho, informándole lo suficiente para conservar su apoyo sin sobrecargarlo de detalles','Ignorarlo hasta que muestre interés por su cuenta','Gestionar de cerca con comunicación intensiva diaria'],
 a:1, e:'Los interesados de alto poder y bajo interés deben mantenerse satisfechos: se les informa lo necesario para conservar su respaldo y anticipar objeciones, sin abrumarlos con comunicación excesiva, que se reserva para los de alto poder y alto interés (gestionar de cerca).'},
{id:'p20', domain:'people', topic:'Compromiso de interesados', q:'Al inicio del proyecto, un interesado se muestra resistente a un nuevo proceso porque no entiende cómo le beneficia. Según el modelo de niveles de compromiso, este interesado se encuentra en el nivel:',
 o:['Líder (Leading)','Neutral','Resistente','De apoyo (Supportive)'],
 a:2, e:'El modelo de niveles de compromiso (desconocedor, resistente, neutral, de apoyo, líder) clasifica a un interesado resistente como aquel que conoce el proyecto pero se opone al cambio. El objetivo del director de proyecto es moverlo progresivamente hacia niveles de apoyo mediante comunicación y gestión del cambio.'},
{id:'p21', domain:'people', topic:'Construir entendimiento compartido', q:'En una reunión de planificación, distintos interesados interpretan de forma diferente un requisito ambiguo del proyecto. ¿Qué técnica es más efectiva para construir un entendimiento compartido?',
 o:['Enviar un correo electrónico con la interpretación del director de proyecto y asumir que todos están de acuerdo','Facilitar una sesión colaborativa donde el grupo discuta y visualice el requisito hasta llegar a una definición común','Dejar que cada interesado use su propia interpretación y resolverlo más adelante','Escalar inmediatamente el desacuerdo al patrocinador'],
 a:1, e:'Construir un entendimiento compartido requiere facilitación activa y técnicas visuales/colaborativas (talleres, prototipos, historias de usuario) que permitan a los interesados alinear su comprensión en tiempo real, en lugar de asumir alineación por comunicación unidireccional o posponer el problema.'},
{id:'p22', domain:'people', topic:'Compromiso de interesados', q:'¿Cuál es la principal diferencia entre "gestionar el compromiso de los interesados" y simplemente "comunicarse" con ellos?',
 o:['No hay diferencia real, son sinónimos en la gestión de proyectos','Gestionar el compromiso implica una relación bidireccional activa para construir y mantener relaciones que satisfagan sus necesidades, mientras que comunicar es principalmente la transmisión de información','Comunicar siempre requiere reuniones presenciales y gestionar el compromiso no','Gestionar el compromiso solo aplica a interesados externos, comunicar solo a internos'],
 a:1, e:'La comunicación es la transmisión de información (a menudo unidireccional), mientras que gestionar el compromiso de los interesados es un proceso activo y bidireccional de construir relaciones, entender expectativas y fomentar su participación adecuada durante todo el proyecto.'},
// ---- DOMINIO: PERSONAS (Equipos virtuales y reglas básicas) ----
{id:'p23', domain:'people', topic:'Equipos virtuales', q:'Un equipo distribuido en tres husos horarios distintos tiene dificultades para colaborar en tiempo real. ¿Cuál es la mejor práctica para mejorar la colaboración?',
 o:['Exigir que todos trabajen en el horario de la sede central','Establecer horas de solapamiento (core hours) acordadas y usar herramientas colaborativas asíncronas para el resto del trabajo','Eliminar las reuniones de sincronización por completo','Reducir el equipo a un solo huso horario aunque implique despedir personal'],
 a:1, e:'Con equipos distribuidos, se recomienda acordar franjas horarias de solapamiento para sincronización crítica y apoyarse en herramientas colaborativas asíncronas (documentos compartidos, tableros, grabaciones) para el resto, respetando el equilibrio de vida de cada miembro en su huso horario.'},
{id:'p24', domain:'people', topic:'Reglas básicas del equipo (Ground Rules)', q:'Al formar un nuevo equipo, el director de proyecto facilita una sesión para que el propio equipo defina cómo se comunicará, cómo resolverá desacuerdos y qué se espera de la puntualidad. ¿Por qué es preferible que estas reglas las defina el equipo y no el director de proyecto unilateralmente?',
 o:['Porque la guía del PMBOK lo exige como requisito obligatorio de cumplimiento','Porque las reglas definidas colectivamente generan mayor compromiso y adhesión que las impuestas desde fuera','Porque reduce el tiempo total de la reunión de planificación','Porque elimina por completo la necesidad de gestionar conflictos después'],
 a:1, e:'Cuando el equipo participa en definir sus propias reglas básicas, existe mayor sentido de propiedad y compromiso para cumplirlas, en línea con los principios de empoderamiento y autoorganización. No elimina los conflictos, pero da un marco compartido para gestionarlos.'},
{id:'p25', domain:'people', topic:'Equipos virtuales', q:'Un miembro de un equipo virtual se siente aislado y desconectado del resto, lo que está afectando su compromiso. ¿Qué acción del director de proyecto es más apropiada?',
 o:['Ignorar el problema porque es inherente al trabajo remoto','Aumentar puntos de contacto informales, videollamadas con cámara activa y momentos de conexión social virtual, además del trabajo formal','Exigir que se traslade a la oficina central','Reducir su carga de trabajo sin explicar el motivo al resto del equipo'],
 a:1, e:'El aislamiento en equipos virtuales se mitiga generando más interacción humana intencional: video con cámara, espacios informales de conversación (virtual coffee), reconocimiento visible y check-ins uno a uno, reforzando pertenencia y confianza pese a la distancia física.'},
// ---- DOMINIO: PERSONAS (Formación, mentoría y empoderamiento) ----
{id:'p26', domain:'people', topic:'Formación del equipo', q:'El equipo necesita adoptar una nueva herramienta de gestión de código antes del próximo sprint. ¿Cuál es la responsabilidad del director de proyecto respecto a la capacitación del equipo?',
 o:['Asumir que el equipo aprenderá por su cuenta sin ningún apoyo','Identificar la brecha de habilidades y facilitar el acceso a la formación necesaria (cursos, mentoría interna, tiempo dedicado)','Contratar inmediatamente personal nuevo que ya conozca la herramienta y prescindir del equipo actual','Posponer la adopción de la herramienta indefinidamente para evitar el esfuerzo de formación'],
 a:1, e:'Una de las tareas del dominio Personas del ECO es "asegurar que los miembros del equipo y los interesados estén adecuadamente capacitados". El director de proyecto identifica brechas de habilidades y facilita el acceso a formación, en lugar de ignorar la necesidad o sustituir al equipo.'},
{id:'p27', domain:'people', topic:'Mentoría', q:'Un miembro senior del equipo dedica tiempo cada semana a guiar a un miembro junior, compartiendo experiencia y ayudándole a resolver problemas por sí mismo en lugar de darle las respuestas directamente. Esto describe principalmente:',
 o:['Gestión del desempeño formal','Mentoría','Evaluación 360 grados','Gestión de conflictos'],
 a:1, e:'La mentoría es una relación de desarrollo en la que una persona con más experiencia guía y apoya el crecimiento de otra, fomentando que resuelva problemas por sí misma en vez de depender de respuestas directas, lo cual fortalece capacidades a largo plazo.'},
{id:'p28', domain:'people', topic:'Empoderamiento', q:'El director de proyecto delega la decisión de qué herramientas técnicas usar al equipo de desarrollo, reservándose la supervisión del progreso y los riesgos generales. ¿Qué beneficio principal busca esta delegación?',
 o:['Reducir la responsabilidad legal del director de proyecto ante fallos técnicos','Aumentar la motivación, la rapidez de decisión y aprovechar el conocimiento experto del equipo en su propio dominio técnico','Eliminar la necesidad de que el director de proyecto entienda algo de tecnología','Cumplir un requisito obligatorio del PMBOK sobre delegación total'],
 a:1, e:'Delegar decisiones técnicas a quienes tienen el conocimiento experto aumenta la calidad de las decisiones, la velocidad y la motivación del equipo (autonomía), sin eximir al director de proyecto de su responsabilidad de supervisar riesgos, progreso y alineación con los objetivos del proyecto.'},
// ---- DOMINIO: PERSONAS (Impedimentos y coaching) ----
{id:'p29', domain:'people', topic:'Eliminar impedimentos', q:'Un equipo ágil reporta en la reunión diaria que llevan dos días bloqueados esperando acceso a un entorno de pruebas que depende de otro departamento. ¿Cuál es el rol MÁS apropiado del director de proyecto o Scrum Master en este caso?',
 o:['Decirle al equipo que resuelva el problema por su cuenta, ya que es autoorganizado','Actuar activamente para eliminar el impedimento, escalando o coordinando con el otro departamento si es necesario','Esperar a la retrospectiva para discutir el bloqueo','Reducir el alcance del sprint sin investigar la causa del bloqueo'],
 a:1, e:'Eliminar impedimentos que están fuera del control directo del equipo es una responsabilidad central del Scrum Master o director de proyecto en un entorno ágil. La autoorganización aplica al «cómo» hacer el trabajo, no exime al facilitador de remover bloqueos externos que el equipo no puede resolver por sí mismo.'},
{id:'p30', domain:'people', topic:'Coaching', q:'Un miembro del equipo tiene el conocimiento técnico necesario para resolver un problema, pero le falta confianza para proponer su solución en las reuniones. ¿Qué enfoque de coaching es más apropiado?',
 o:['Dar la respuesta directamente al grupo para ahorrar tiempo','Hacer preguntas abiertas que ayuden a esa persona a articular y defender su propia solución ante el equipo','Ignorar la situación, ya que no es responsabilidad del director de proyecto','Reemplazar a esa persona por otra más segura de sí misma'],
 a:1, e:'El coaching efectivo usa preguntas abiertas (no respuestas directas) para ayudar a la persona a desarrollar su propio pensamiento y confianza, en lugar de resolverle el problema, lo que genera crecimiento sostenible y mayor participación futura en el equipo.'},
// ---- DOMINIO: PERSONAS (Comunicación y toma de decisiones) ----
{id:'p31', domain:'people', topic:'Métodos de comunicación', q:'El director de proyecto necesita informar a 40 interesados sobre un cambio menor de calendario que no requiere discusión inmediata. ¿Qué método de comunicación es más eficiente?',
 o:['Comunicación interactiva (reunión en tiempo real con todos)','Comunicación push (correo electrónico o boletín informativo)','Comunicación pull (publicar en un repositorio y esperar a que lo consulten por su cuenta)','Llamadas telefónicas individuales a cada interesado'],
 a:1, e:'La comunicación push envía información directamente a los receptores (correo, informes, boletines) sin garantizar que la reciban o entiendan, pero es eficiente para información unidireccional no urgente. La comunicación interactiva se reserva para temas que requieren diálogo, y la pull para información de referencia voluminosa.'},
{id:'p32', domain:'people', topic:'Métodos de comunicación', q:'Un plan de proyecto complejo se publica en un portal donde los interesados pueden consultarlo cuando lo necesiten, sin que se les envíe activamente. ¿Qué tipo de comunicación es esta?',
 o:['Push','Pull','Interactiva','Formal escrita únicamente'],
 a:1, e:'La comunicación pull se usa para grandes volúmenes de información o audiencias muy amplias: el contenido se pone a disposición (repositorios, intranets, bases de conocimiento) y los interesados acceden a él según su propia necesidad, en lugar de recibirlo de forma activa.'},
{id:'p33', domain:'people', topic:'Toma de decisiones', q:'Ante una decisión crítica que afecta a todo el equipo, el director de proyecto reúne al equipo, escucha todas las opiniones y busca que todos, aunque no estén cien por cien de acuerdo, puedan apoyar la decisión final. ¿Qué modelo de toma de decisiones describe mejor esto?',
 o:['Autocrático','Consultivo autocrático','Consenso (todos pueden vivir con la decisión)','Mayoría simple por votación'],
 a:2, e:'El consenso no exige unanimidad total, sino que todos los miembros puedan aceptar y apoyar la decisión final aunque no sea su primera opción. Se diferencia del modelo autocrático (decide una persona) y de la votación por mayoría (puede dejar a una minoría insatisfecha sin buscar su aceptación).'},
{id:'p34', domain:'people', topic:'Toma de decisiones', q:'En una emergencia operativa durante el despliegue de un sistema crítico, el director de proyecto decide unilateralmente revertir el cambio sin consultar al equipo, dado el riesgo inminente. ¿Qué modelo de decisión aplicó?',
 o:['Consenso','Autocrático','Delegado al equipo','Democrático por votación'],
 a:1, e:'El modelo autocrático implica que una sola persona toma la decisión sin consultar previamente a otros. Es apropiado en emergencias donde la velocidad es crítica, aunque en general reduce la aceptación del equipo y debe usarse con moderación fuera de estos contextos.'},
{id:'p35', domain:'people', topic:'Diversidad e inclusión', q:'Un equipo multicultural muestra estilos de comunicación muy distintos: algunos prefieren dar su opinión directamente en las reuniones, otros prefieren reflexionar antes de responder. ¿Qué debería hacer el director de proyecto para fomentar la inclusión?',
 o:['Exigir que todos adopten el mismo estilo de comunicación directo','Reconocer y adaptar los formatos de participación (por ejemplo, dar tiempo para reflexionar o permitir aportes escritos) para que todos puedan contribuir plenamente','Ignorar las diferencias culturales porque no son relevantes para el proyecto','Excluir de las decisiones a quienes no participen verbalmente en la reunión'],
 a:1, e:'La inclusión efectiva reconoce las diferencias culturales y de estilo de comunicación, y adapta los formatos (tiempo de reflexión, canales escritos, rondas estructuradas) para que todas las voces puedan aportar, en lugar de imponer un único estilo dominante.'},
{id:'p36', domain:'people', topic:'Diversidad e inclusión', q:'¿Cuál es el principal beneficio, respaldado por la guía del PMBOK, de contar con un equipo diverso en términos de experiencia, género y origen?',
 o:['Reduce siempre el coste total del proyecto de forma directa','Aporta una gama más amplia de perspectivas que mejora la resolución de problemas y la innovación','Elimina la necesidad de gestión de conflictos','Simplifica la comunicación al no requerir adaptación de estilos'],
 a:1, e:'La diversidad de perspectivas, experiencias y formas de pensar generalmente mejora la calidad de las decisiones, la creatividad y la resolución de problemas complejos, aunque puede requerir más esfuerzo consciente de comunicación e inclusión por parte del líder.'},
{id:'p37', domain:'people', topic:'Gestión del desempeño', q:'Un miembro del equipo, antes muy productivo, ha reducido notablemente la calidad de su trabajo en las últimas dos semanas. ¿Cuál es el primer paso recomendado del director de proyecto?',
 o:['Documentar el bajo desempeño y notificarlo inmediatamente a Recursos Humanos','Tener una conversación privada y empática para entender la causa raíz antes de tomar cualquier acción correctiva','Reasignar sus tareas a otro miembro sin hablar con la persona','Ignorarlo, asumiendo que se resolverá solo'],
 a:1, e:'Antes de escalar o documentar formalmente, la mejor práctica es indagar la causa raíz mediante una conversación privada y empática -que podría revelar problemas personales, falta de claridad en las tareas o sobrecarga- y así responder de forma proporcional y humana.'},
{id:'p38', domain:'people', topic:'Reconocimiento y recompensas', q:'El director de proyecto quiere reconocer públicamente el esfuerzo de un miembro del equipo que resolvió un problema crítico fuera de su horario habitual. ¿Cuál es la consideración MÁS importante antes de hacerlo?',
 o:['Verificar que el reconocimiento sea culturalmente apropiado y que la persona se sienta cómoda con el reconocimiento público','Dar siempre una recompensa monetaria en lugar de reconocimiento verbal','Esperar a la evaluación de desempeño anual para mencionarlo','Reconocer únicamente a todo el equipo en conjunto, nunca a personas individuales'],
 a:0, e:'No todas las personas ni culturas valoran el reconocimiento público de la misma manera; algunas lo prefieren en privado. Un buen sistema de reconocimiento y recompensas debe ser oportuno, específico y sensible a las preferencias culturales e individuales de cada persona, no una fórmula única.'},
{id:'p39', domain:'people', topic:'Roles ágiles', q:'En un equipo Scrum, ¿quién es responsable de maximizar el valor del producto resultante del trabajo del equipo de desarrollo y de gestionar el Product Backlog?',
 o:['El Scrum Master','El Product Owner','El director de proyecto tradicional','El patrocinador del proyecto'],
 a:1, e:'El Product Owner es responsable de maximizar el valor del producto y de gestionar el Product Backlog, incluyendo su contenido, disponibilidad y priorización. El Scrum Master, en cambio, se enfoca en facilitar el proceso Scrum y eliminar impedimentos.'},
{id:'p40', domain:'people', topic:'Roles ágiles', q:'¿Cuál es la diferencia clave entre el rol del Scrum Master y el de un director de proyecto tradicional?',
 o:['No hay diferencia; son el mismo rol con distinto nombre','El Scrum Master actúa como facilitador y coach del equipo y del proceso ágil, sin autoridad de mando sobre las personas, mientras que un director de proyecto tradicional suele tener mayor autoridad directa sobre el alcance, cronograma y recursos','El Scrum Master siempre tiene más autoridad jerárquica que un director de proyecto','El director de proyecto tradicional nunca participa en la planificación'],
 a:1, e:'El Scrum Master es un líder servicial que facilita el proceso, elimina impedimentos y protege al equipo, careciendo de autoridad de mando directa; el director de proyecto en enfoques predictivos suele tener mayor responsabilidad directa sobre la planificación integrada y el control de línea base.'},
{id:'p41', domain:'people', topic:'Equipos multifuncionales', q:'Un equipo de proyecto incluye personas con habilidades en varias disciplinas (diseño, desarrollo, pruebas), de modo que pueden colaborar en distintas partes del trabajo sin depender totalmente de especialistas externos. Esto describe un equipo:',
 o:['Funcional jerárquico','Multifuncional (cross-functional)','Matricial débil','De proyecto virtual únicamente'],
 a:1, e:'Un equipo multifuncional (cross-functional) reúne las habilidades necesarias para entregar valor de principio a fin sin depender constantemente de otros departamentos, lo cual reduce las esperas y mejora la capacidad de respuesta, especialmente en entornos ágiles.'},
{id:'p42', domain:'people', topic:'Habilidades en T', q:'Se anima a los miembros del equipo a desarrollar una especialidad profunda en su área principal, pero también conocimientos básicos en áreas relacionadas, para poder ayudarse mutuamente cuando sea necesario. Este concepto se conoce como:',
 o:['Habilidades en T (T-shaped skills)','Especialización estricta','Sobrecarga de recursos (resource leveling)','Gestión funcional pura'],
 a:0, e:'Las habilidades en T combinan profundidad en una especialidad (la barra vertical de la T) con amplitud de conocimiento en áreas relacionadas (la barra horizontal), lo que aumenta la flexibilidad del equipo y reduce cuellos de botella cuando alguien está sobrecargado o ausente.'},
{id:'p43', domain:'people', topic:'Confianza en el equipo', q:'¿Cuál de las siguientes acciones contribuye MÁS eficazmente a construir confianza dentro de un equipo de proyecto recién formado?',
 o:['Evitar mostrar vulnerabilidad o admitir errores como líder','Cumplir consistentemente los compromisos, ser transparente sobre los problemas y admitir errores propios','Centralizar toda la información en el director de proyecto para controlar el mensaje','Evaluar el desempeño del equipo únicamente mediante métricas cuantitativas'],
 a:1, e:'La confianza se construye con consistencia entre lo que se dice y se hace, transparencia sobre problemas (incluidos los propios errores del líder) y fiabilidad en el tiempo. Ocultar información o evitar la vulnerabilidad genera el efecto contrario, erosionando la confianza del equipo.'},
{id:'p44', domain:'people', topic:'Responsabilidad compartida', q:'Al usar una matriz RACI para asignar responsabilidades, ¿qué representa la letra "A" (Accountable) para una tarea determinada?',
 o:['La persona que realiza físicamente el trabajo','La persona que debe ser consultada antes de tomar la decisión','La persona en última instancia responsable de que la tarea se complete correctamente, aunque no la ejecute personalmente','La persona que solo necesita ser informada del resultado'],
 a:2, e:'"Accountable" (responsable último) es quien rinde cuentas del resultado final de la tarea, aunque quien la ejecute sea otro ("Responsible"/Ejecuta). Es clave que cada tarea tenga solo una persona "Accountable" para evitar ambigüedad sobre quién responde por el resultado.'},
{id:'p45', domain:'people', topic:'Inteligencia emocional', q:'Durante una retrospectiva, un miembro del equipo expresa frustración con el proceso actual de forma acalorada. El director de proyecto reconoce la emoción sin juzgarla, valida que su preocupación es legítima y luego invita al grupo a explorar soluciones juntos. ¿Qué habilidad de inteligencia emocional demuestra principalmente esta respuesta?',
 o:['Automotivación','Empatía y habilidad social','Ambición personal','Pensamiento analítico'],
 a:1, e:'Reconocer y validar la emoción de otra persona sin juzgarla es empatía; canalizar esa emoción hacia una conversación constructiva en grupo es habilidad social. Ambas son componentes centrales de la inteligencia emocional que ayudan a mantener un ambiente psicológicamente seguro.'},
// ---- DOMINIO: PERSONAS (Seguridad psicológica, delegación y escalado) ----
{id:'p46', domain:'people', topic:'Seguridad psicológica', q:'Un equipo donde los miembros se sienten cómodos admitiendo errores, haciendo preguntas "obvias" y proponiendo ideas poco convencionales sin miedo a ser ridiculizados, tiene alto nivel de:',
 o:['Autoridad formal','Seguridad psicológica','Especialización técnica','Rotación de personal'],
 a:1, e:'La seguridad psicológica es la creencia compartida de que el equipo es un entorno seguro para asumir riesgos interpersonales -admitir errores, preguntar, disentir- sin temor a consecuencias negativas. Es uno de los mayores predictores de equipos de alto desempeño según investigaciones citadas en el material de PMI.'},
{id:'p47', domain:'people', topic:'Acta de constitución del equipo', q:'El equipo redacta conjuntamente un documento que define valores compartidos, reglas básicas de comunicación y cómo tomarán decisiones. ¿Cómo se denomina comúnmente este documento?',
 o:['Acta de constitución del proyecto (Project Charter)','Acta de constitución del equipo (Team Charter)','Registro de interesados','Plan de gestión de recursos'],
 a:1, e:'El Team Charter (acta de constitución del equipo) documenta los valores, acuerdos de trabajo y reglas básicas que el equipo define para sí mismo, distinto del Project Charter, que autoriza formalmente el proyecto y es emitido por el patrocinador o la organización.'},
{id:'p48', domain:'people', topic:'Escalado de conflictos', q:'Un director de proyecto ha intentado mediar un conflicto grave entre dos líderes técnicos durante varias semanas sin éxito, y el desacuerdo está bloqueando decisiones críticas de arquitectura. ¿Cuál es la acción MÁS apropiada en este punto?',
 o:['Seguir intentando mediar indefinidamente sin cambiar de enfoque','Escalar el conflicto a un nivel superior de gestión o gobernanza del proyecto para su resolución','Ignorar el conflicto y avanzar con una decisión unilateral sin comunicarla','Disolver el equipo técnico completo'],
 a:1, e:'Cuando los intentos razonables de resolución al nivel del equipo fallan y el conflicto bloquea el progreso, escalarlo a la gobernanza del proyecto (comité directivo, patrocinador) es apropiado y responsable, evitando que el estancamiento dañe el cronograma o la calidad.'},
{id:'p49', domain:'people', topic:'Liderazgo transformacional', q:'Un director de proyecto inspira a su equipo compartiendo una visión convincente del impacto que tendrá el producto en los usuarios finales, y motiva al equipo a superar sus propias expectativas de desempeño. Esto es un ejemplo de liderazgo:',
 o:['Transaccional','Transformacional','Laissez-faire','Burocrático'],
 a:1, e:'El liderazgo transformacional inspira y motiva a través de una visión compartida, apelando a valores y aspiraciones para lograr un desempeño superior al esperado. Se diferencia del liderazgo transaccional, que se basa en intercambios claros de recompensas por desempeño (dar algo a cambio de cumplir metas).'},
{id:'p50', domain:'people', topic:'Construcción de equipo (Tuckman)', q:'Un equipo lleva meses trabajando junto, resuelve problemas con fluidez, se apoya mutuamente sin necesidad de supervisión constante y logra resultados consistentemente altos. Según Tuckman, está en la etapa de:',
 o:['Normalización (Norming)','Desempeño (Performing)','Formación (Forming)','Disolución (Adjourning)'],
 a:1, e:'La etapa de Performing se caracteriza por un equipo maduro, interdependiente, competente y con alta autonomía, que logra resultados de forma consistente con mínima supervisión directa, habiendo ya resuelto los conflictos típicos de la etapa de Storming.'},
{id:'p51', domain:'people', topic:'Construcción de equipo (Tuckman)', q:'Al cierre de un proyecto, el equipo se reúne para celebrar los logros, documentar lecciones aprendidas y despedirse antes de que cada persona regrese a su departamento funcional. Según Tuckman, esta etapa se denomina:',
 o:['Normalización (Norming)','Conflicto (Storming)','Disolución (Adjourning)','Desempeño (Performing)'],
 a:2, e:'La etapa de Adjourning (disolución) ocurre al finalizar el trabajo del equipo, e incluye el reconocimiento de logros, el cierre emocional y la transición de sus miembros a otras asignaciones. Es una etapa a menudo ignorada, pero importante para el bienestar del equipo.'},
{id:'p52', domain:'people', topic:'Modelo de saliencia de interesados', q:'Un interesado tiene alta legitimidad y alta urgencia respecto a un tema del proyecto, pero poder limitado para influir directamente en las decisiones. Según el modelo de saliencia de interesados, se le clasifica como interesado:',
 o:['Definitivo (posee las tres características: poder, legitimidad y urgencia)','Dependiente (legitimidad y urgencia, sin poder)','Dominante (poder y legitimidad, sin urgencia)','Peligroso (poder y urgencia, sin legitimidad)'],
 a:1, e:'El modelo de saliencia clasifica a los interesados según combinaciones de poder, legitimidad y urgencia. Un interesado con legitimidad y urgencia pero sin poder directo es "dependiente": depende de otros interesados con poder para que sus demandas legítimas y urgentes sean atendidas.'},
{id:'p53', domain:'people', topic:'Coaching vs. mentoría', q:'¿Cuál es la diferencia principal entre coaching y mentoría en el contexto de desarrollo del equipo?',
 o:['Son términos idénticos sin diferencia práctica','El coaching se centra en desbloquear el potencial de la persona mediante preguntas, generalmente sobre un objetivo específico y a corto plazo; la mentoría es una relación más amplia y duradera basada en compartir experiencia y conocimiento','La mentoría siempre es remunerada y el coaching nunca lo es','El coaching solo puede hacerlo un director de proyecto certificado'],
 a:1, e:'El coaching suele enfocarse en desarrollar habilidades o resolver un desafío específico mediante preguntas que ayudan a la persona a encontrar sus propias respuestas; la mentoría es una relación más amplia y de largo plazo donde alguien con más experiencia comparte conocimiento y orientación de carrera.'},
{id:'p54', domain:'people', topic:'Delegación', q:'Con un equipo altamente competente y comprometido que ya ha demostrado dominio de sus tareas, ¿qué estilo de liderazgo situacional es más apropiado para maximizar su motivación y eficiencia?',
 o:['Dirigir con instrucciones detalladas','Entrenar/Vender explicando cada decisión','Apoyar con supervisión constante','Delegar, otorgando autonomía y responsabilidad plena sobre las decisiones del día a día'],
 a:3, e:'Con equipos de alta competencia y alto compromiso, el liderazgo situacional recomienda delegar: otorgar autonomía plena y minimizar la supervisión directa, ya que el equipo tiene tanto la capacidad como la motivación para autogestionarse eficazmente.'},
{id:'p55', domain:'people', topic:'Retroalimentación efectiva', q:'Al dar retroalimentación correctiva a un miembro del equipo, el director de proyecto describe la situación concreta, el comportamiento observado y el impacto que tuvo, evitando generalizaciones como "siempre haces esto". ¿Qué modelo de retroalimentación está aplicando?',
 o:['Modelo SBI (Situación-Comportamiento-Impacto)','Modelo FODA (fortalezas, oportunidades, debilidades, amenazas)','Rueda de Deming (PDCA)','Matriz RACI'],
 a:0, e:'El modelo SBI (Situation-Behavior-Impact) estructura la retroalimentación describiendo la situación específica, el comportamiento observado objetivamente y el impacto que tuvo, evitando juicios de carácter o generalizaciones, lo que hace la retroalimentación más específica, aceptable y accionable.'},
{id:'p56', domain:'people', topic:'Fuentes de conflicto', q:'Según estudios clásicos sobre fuentes de conflicto en proyectos (Thamhain y Wilemon), ¿cuál de las siguientes suele ser una de las fuentes MÁS frecuentes de conflicto durante la ejecución del proyecto?',
 o:['Diferencias sobre el logotipo de la empresa','Desacuerdos sobre prioridades y cronograma del proyecto','Preferencias personales de música en la oficina','El color de la interfaz de usuario del sistema de tickets'],
 a:1, e:'Los desacuerdos sobre cronograma y prioridades del proyecto están entre las fuentes de conflicto más citadas en la literatura clásica de gestión de proyectos, junto con los recursos limitados, las opiniones técnicas y los procedimientos administrativos, por encima de conflictos puramente personales.'},
{id:'p57', domain:'people', topic:'Onboarding remoto', q:'Un nuevo miembro se incorpora a un equipo totalmente remoto. ¿Qué práctica ayuda MÁS a que se integre rápido y se sienta parte del equipo?',
 o:['Enviarle solo el manual técnico y dejar que se integre por su cuenta','Asignarle un compañero de bienvenida (buddy), presentaciones estructuradas al equipo y check-ins frecuentes durante las primeras semanas','Esperar tres meses antes de incluirlo en cualquier reunión de equipo','Evaluar su desempeño formalmente en la primera semana sin período de adaptación'],
 a:1, e:'Un proceso estructurado de onboarding remoto -compañero de bienvenida, presentaciones intencionadas y seguimiento cercano en las primeras semanas- acelera la integración social y técnica, compensando la falta de interacción física espontánea que existe en oficinas presenciales.'},
{id:'p58', domain:'people', topic:'Gestión del cambio organizacional (lado humano)', q:'La organización está migrando a una nueva metodología de trabajo y varios empleados muestran resistencia por miedo a perder su rol actual. ¿Cuál es la mejor estrategia inicial del director de proyecto para reducir esta resistencia?',
 o:['Imponer el cambio sin explicaciones para acelerar la adopción','Comunicar claramente el "por qué" del cambio, involucrar a los afectados en el diseño de la transición y reconocer sus preocupaciones legítimas','Ignorar la resistencia porque es un problema de Recursos Humanos, no del proyecto','Retrasar el cambio indefinidamente hasta que la resistencia desaparezca sola'],
 a:1, e:'La resistencia al cambio suele disminuir cuando las personas entienden el propósito del cambio, sienten que sus preocupaciones son escuchadas y participan de algún modo en el proceso, en línea con modelos de gestión del cambio como ADKAR o Kotter, que el director de proyecto también debe conocer.'},
{id:'p59', domain:'people', topic:'Anclaje en negociación', q:'Un proveedor abre la negociación con un precio deliberadamente alto para influir en el rango de la conversación posterior. ¿Qué táctica de negociación está utilizando?',
 o:['BATNA','Anclaje (Anchoring)','Consenso','Escalado formal'],
 a:1, e:'El anclaje consiste en presentar una primera oferta (a menudo extrema) para influir psicológicamente en el rango percibido de la negociación posterior. Un negociador preparado, con su propio BATNA claro, no se deja arrastrar automáticamente por el ancla de la otra parte.'},
{id:'p60', domain:'people', topic:'Reconocimiento del desempeño del equipo', q:'Al final de cada sprint, el equipo dedica tiempo a reconocer explícitamente las contribuciones individuales y colectivas antes de pasar a planificar el siguiente sprint. ¿Cuál es el principal valor de esta práctica para la gestión de personas?',
 o:['Cumplir un requisito contractual obligatorio','Reforzar comportamientos positivos, aumentar la moral y consolidar la cohesión del equipo de forma continua, no solo al final del proyecto','Sustituir la necesidad de retrospectivas','Evitar tener que dar retroalimentación correctiva en el futuro'],
 a:1, e:'El reconocimiento frecuente y oportuno -no reservado solo al cierre del proyecto- refuerza comportamientos deseados, mejora la moral y la cohesión del equipo de forma continua. Es un componente activo de la gestión de personas, no un mero trámite contractual.'},
// ---- DOMINIO: PROCESO (Integración y adaptación del enfoque) ----
{id:'r01', domain:'process', topic:'Adaptación (tailoring)', q:'Un proyecto tiene requisitos muy estables y bien definidos desde el inicio, alta necesidad de cumplimiento regulatorio y bajo tolerancia al cambio. ¿Qué enfoque de desarrollo es generalmente más apropiado?',
 o:['Un enfoque totalmente ágil con iteraciones muy cortas','Un enfoque predictivo, con planificación detallada por adelantado','Un enfoque completamente improvisado sin ninguna planificación','Un enfoque híbrido obligatoriamente en todos los casos'],
 a:1, e:'Cuando los requisitos son estables, bien comprendidos y existen fuertes restricciones regulatorias, un enfoque predictivo (planificación detallada, línea base de alcance/cronograma/costo) suele ser más eficiente y controlable que uno ágil, que brilla más con requisitos cambiantes o poco claros.'},
{id:'r02', domain:'process', topic:'Acta de constitución del proyecto', q:'¿Cuál es el propósito principal del Acta de Constitución del Proyecto (Project Charter)?',
 o:['Detallar el cronograma día a día de todas las actividades del proyecto','Autorizar formalmente la existencia del proyecto y otorgar al director de proyecto la autoridad para usar los recursos organizacionales','Sustituir la necesidad de un plan de gestión del proyecto','Documentar los riesgos identificados durante la ejecución'],
 a:1, e:'El Project Charter autoriza formalmente el proyecto (o fase) y confiere al director de proyecto la autoridad para aplicar los recursos de la organización a las actividades del proyecto. Es un documento de alto nivel, no un cronograma detallado ni un plan de gestión.'},
{id:'r03', domain:'process', topic:'Control integrado de cambios', q:'Un interesado solicita un cambio significativo de alcance a mitad del proyecto. ¿Cuál es el propósito principal del proceso de control integrado de cambios ante esta solicitud?',
 o:['Aprobar automáticamente cualquier cambio solicitado por un interesado importante','Evaluar el impacto holístico del cambio en alcance, cronograma, costo, calidad y riesgo antes de aprobarlo, rechazarlo o diferirlo formalmente','Rechazar automáticamente todos los cambios para proteger la línea base original','Delegar la decisión únicamente al equipo técnico sin registro formal'],
 a:1, e:'El control integrado de cambios asegura que cada cambio solicitado se evalúe de forma integral -su efecto en todas las líneas base y objetivos- antes de que sea aprobado, rechazado o diferido, evitando decisiones aisladas que ignoren efectos colaterales.'},
{id:'r04', domain:'process', topic:'Plan vs. documentos del proyecto', q:'¿Cuál es la diferencia principal entre el "plan para la dirección del proyecto" y los "documentos del proyecto"?',
 o:['No existe diferencia, son sinónimos','El plan para la dirección del proyecto describe cómo se ejecutará, monitoreará y controlará el proyecto (incluye líneas base); los documentos del proyecto son otros artefactos de apoyo (registros, informes) que no forman parte de las líneas base formales','Los documentos del proyecto siempre requieren aprobación del patrocinador y el plan no','El plan para la dirección del proyecto se actualiza a diario, los documentos del proyecto nunca cambian'],
 a:1, e:'El plan para la dirección del proyecto integra los planes subsidiarios y las líneas base formales (alcance, cronograma, costo). Los documentos del proyecto (registro de riesgos, registro de interesados, informes) apoyan la ejecución pero no forman parte de las líneas base sujetas a control formal de cambios de la misma manera.'},
{id:'r05', domain:'process', topic:'Enfoque híbrido', q:'Un proyecto de desarrollo de un dispositivo médico combina un desarrollo de hardware con enfoque predictivo (por requisitos regulatorios estrictos) y un desarrollo de software de la interfaz con enfoque ágil (por la necesidad de iterar rápido con usuarios). ¿Qué tipo de enfoque de ciclo de vida describe esto?',
 o:['Enfoque predictivo puro','Enfoque ágil puro','Enfoque híbrido','Enfoque en cascada estricto'],
 a:2, e:'Un enfoque híbrido combina elementos predictivos y ágiles dentro del mismo proyecto, aplicando cada uno donde mejor se adapta a las características de cada componente de trabajo -en este caso, predictivo para hardware regulado y ágil para software iterativo.'},
{id:'r06', domain:'process', topic:'Elaboración progresiva', q:'Al inicio del proyecto, el alcance se define a un nivel general, y a medida que se dispone de más información se va detallando y refinando en ciclos sucesivos de planificación. Este concepto se llama:',
 o:['Gestión del valor ganado','Elaboración progresiva','Verificación del alcance','Gestión de la configuración'],
 a:1, e:'La elaboración progresiva es el proceso iterativo de aumentar el nivel de detalle de un plan a medida que se dispone de información más precisa y estimaciones más fiables, común tanto en proyectos predictivos (planificación gradual) como ágiles (refinamiento del backlog).'},
// ---- DOMINIO: PROCESO (Gestión del alcance) ----
{id:'r07', domain:'process', topic:'Alcance del proyecto', q:'Un miembro del equipo añade funcionalidades extra no solicitadas por el cliente porque "cree que le van a gustar", sin pasar por el proceso de control de cambios. ¿Cómo se denomina esta práctica y por qué es problemática?',
 o:['Gold plating (sobre-ingeniería); es problemática porque consume recursos no planificados y puede introducir riesgo sin aprobación formal','Scope creep positivo, siempre recomendable','Gestión de la configuración correcta','Verificación del alcance según el plan'],
 a:0, e:'El "gold plating" es agregar funcionalidad extra no solicitada, generalmente con buenas intenciones, pero sin pasar por el control de cambios. Consume tiempo y presupuesto no planificados, puede introducir riesgos y no aporta valor validado por el cliente.'},
{id:'r08', domain:'process', topic:'Estructura de desglose del trabajo (WBS)', q:'Según la regla del 100% de la EDT/WBS, ¿qué establece este principio?',
 o:['El proyecto debe estar completado al 100% antes de iniciar cualquier control de cambios','La WBS debe incluir el 100% del trabajo definido por el alcance del proyecto, incluyendo la gestión del proyecto, sin solapamientos entre sus elementos','Cada paquete de trabajo debe tardar exactamente el mismo tiempo','El 100% de los interesados deben aprobar la WBS antes de cualquier cambio'],
 a:1, e:'La regla del 100% establece que la WBS debe capturar el 100% del alcance del trabajo (incluida la dirección del proyecto), descompuesto en niveles sin duplicar ni omitir trabajo entre los elementos del mismo nivel, dando una base completa para estimar y controlar el proyecto.'},
{id:'r09', domain:'process', topic:'Alcance en entornos ágiles', q:'En un proyecto ágil, ¿qué artefacto cumple una función similar a la de la línea base de alcance en un proyecto predictivo, aunque con carácter dinámico en lugar de fijo?',
 o:['El Product Backlog, priorizado y refinado continuamente','El acta de constitución del proyecto','El registro de riesgos','El diagrama de Gantt'],
 a:0, e:'El Product Backlog funciona como el "alcance vivo" en entornos ágiles: se prioriza y refina de forma continua a medida que se aprende más, en contraste con la línea base de alcance predictiva, que se congela tras la aprobación y solo cambia mediante control formal de cambios.'},
{id:'r10', domain:'process', topic:'Matriz de trazabilidad de requisitos', q:'¿Cuál es el propósito principal de una matriz de trazabilidad de requisitos?',
 o:['Calcular el valor ganado del proyecto','Vincular cada requisito con su origen y con los entregables que lo satisfacen, para asegurar que ningún requisito se pierda durante el proyecto','Definir los roles y responsabilidades del equipo','Sustituir la necesidad de un registro de interesados'],
 a:1, e:'La matriz de trazabilidad conecta cada requisito con su origen (necesidad de negocio, interesado) y con los entregables, casos de prueba u objetivos del proyecto que lo cumplen, permitiendo verificar que todos los requisitos se atienden y gestionar el impacto de los cambios.'},
{id:'r11', domain:'process', topic:'Línea base del alcance', q:'¿Qué componentes conforman la línea base del alcance de un proyecto predictivo?',
 o:['Solo el enunciado del alcance del proyecto','El enunciado del alcance del proyecto, la EDT/WBS y su diccionario de la WBS','Únicamente el registro de interesados','El plan de gestión de riesgos y el registro de riesgos'],
 a:1, e:'La línea base del alcance está formada por el enunciado del alcance del proyecto aprobado, la estructura de desglose del trabajo (WBS) y el diccionario de la WBS que detalla cada paquete de trabajo. Sirve como referencia para medir el desempeño del alcance.'},
{id:'r12', domain:'process', topic:'Definición de terminado (Definition of Done)', q:'En un equipo Scrum, ¿cuál es la diferencia principal entre "Criterios de aceptación" y "Definición de terminado" (Definition of Done)?',
 o:['Son términos idénticos e intercambiables','Los criterios de aceptación son específicos de cada historia de usuario y definen cuándo esa historia cumple su propósito; la Definición de Terminado es un estándar de calidad general aplicable a todos los incrementos del producto','La Definición de Terminado solo aplica al final del proyecto completo','Los criterios de aceptación los define únicamente el Scrum Master'],
 a:1, e:'Los criterios de aceptación son condiciones específicas de una historia de usuario individual que el Product Owner define para considerarla completa. La Definición de Terminado es un checklist de calidad transversal (por ejemplo, "código revisado, probado y documentado") que aplica a todo incremento entregado, sin importar la historia.'},
// ---- DOMINIO: PROCESO (Gestión del cronograma) ----
{id:'r13', domain:'process', topic:'Ruta crítica', q:'¿Qué representa la ruta crítica en un diagrama de red del cronograma del proyecto?',
 o:['La secuencia de actividades con menor duración total','La secuencia de actividades con la mayor duración total, que determina la duración mínima del proyecto y cuyas actividades tienen cero holgura','Las actividades que pueden eliminarse sin afectar el proyecto','Únicamente las actividades asignadas al director de proyecto'],
 a:1, e:'La ruta crítica es la secuencia de actividades dependientes con la mayor duración total del proyecto; determina la duración mínima posible del proyecto. Las actividades en la ruta crítica tienen holgura (float) igual a cero: cualquier retraso en ellas retrasa todo el proyecto.'},
{id:'r14', domain:'process', topic:'Holgura (float)', q:'Una actividad puede retrasarse 3 días sin afectar la fecha de finalización del proyecto, pero cualquier retraso mayor sí la afectaría. ¿Qué concepto describe esos 3 días?',
 o:['Holgura total (total float) de 3 días','Ruta crítica de 3 días','Adelanto (lead) de 3 días','Contingencia de 3 días'],
 a:0, e:'La holgura total es la cantidad de tiempo que una actividad puede retrasarse desde su fecha de inicio más temprana sin retrasar la fecha de finalización del proyecto ni violar restricciones. Una holgura de cero indica que la actividad está en la ruta crítica.'},
{id:'r15', domain:'process', topic:'Método de la ruta crítica (cálculo)', q:'Un proyecto tiene dos rutas posibles: la Ruta A con actividades que suman 18 días y la Ruta B con actividades que suman 23 días, ambas comenzando y terminando en los mismos hitos. ¿Cuál es la duración del proyecto y la holgura de la Ruta A?',
 o:['El proyecto dura 18 días; la Ruta A tiene 0 días de holgura','El proyecto dura 23 días; la Ruta A tiene 5 días de holgura','El proyecto dura 41 días; ambas rutas son críticas','El proyecto dura 23 días; la Ruta B tiene 5 días de holgura'],
 a:1, e:'La duración del proyecto la determina la ruta más larga (23 días = ruta crítica, con 0 días de holgura). La Ruta A, al ser 5 días más corta, tiene 5 días de holgura total: puede retrasarse hasta 5 días sin afectar la fecha fin del proyecto.'},
{id:'r16', domain:'process', topic:'Compresión del cronograma', q:'El proyecto va con retraso y el director de proyecto decide añadir recursos adicionales a las actividades de la ruta crítica para acelerarlas, aceptando un mayor costo. ¿Qué técnica de compresión del cronograma es esta?',
 o:['Fast tracking (ejecución rápida)','Crashing (intensificación)','Nivelación de recursos','Adelantos y retrasos (leads and lags)'],
 a:1, e:'El crashing añade recursos adicionales a las actividades críticas para acortar su duración, normalmente aumentando el costo. El fast tracking, en cambio, consiste en ejecutar actividades en paralelo que originalmente estaban planificadas en secuencia, lo que aumenta el riesgo en lugar del costo.'},
{id:'r17', domain:'process', topic:'Velocidad del equipo (Agile)', q:'Un equipo Scrum completó 32 puntos de historia en el último sprint, y su promedio de los tres sprints anteriores fue de 28 puntos. ¿Qué mide este dato de "velocidad"?',
 o:['El costo total del sprint en dinero','La cantidad de trabajo (medida en puntos de historia) que el equipo completa típicamente por sprint, útil para pronosticar el alcance de sprints futuros','El número de errores encontrados en producción','La cantidad de horas trabajadas por cada miembro del equipo'],
 a:1, e:'La velocidad mide la cantidad de trabajo (puntos de historia, o a veces horas) que un equipo completa de forma consistente por iteración. Se usa para pronosticar cuánto backlog puede comprometerse en sprints futuros, pero no debe compararse entre equipos distintos ni usarse como métrica de desempeño individual.'},
{id:'r18', domain:'process', topic:'Gráfico de trabajo pendiente (burndown)', q:'En un gráfico burndown de sprint, la línea real de trabajo pendiente se mantiene notablemente por encima de la línea ideal durante toda la segunda mitad del sprint. ¿Qué indica esto MÁS probablemente?',
 o:['El equipo terminará el sprint antes de lo previsto','El equipo probablemente no completará todo el trabajo comprometido para el sprint al ritmo actual','El sprint no tiene ningún problema, es una variación normal siempre','El gráfico burndown mide la satisfacción del cliente, no el progreso'],
 a:1, e:'Cuando la línea real de trabajo pendiente se mantiene por encima de la línea ideal, indica que el equipo va más lento de lo planificado y, de continuar esa tendencia, no completará todo el alcance comprometido del sprint, lo que amerita una conversación en la reunión diaria o con el Product Owner.'},
{id:'r19', domain:'process', topic:'Diagramación por precedencia', q:'En el Método de Diagramación por Precedencia (PDM), una relación donde la actividad sucesora no puede comenzar hasta que la actividad predecesora haya finalizado se denomina:',
 o:['Fin a Inicio (FS - Finish to Start)','Inicio a Inicio (SS - Start to Start)','Fin a Fin (FF - Finish to Finish)','Inicio a Fin (SF - Start to Finish)'],
 a:0, e:'Fin a Inicio (FS) es la relación de precedencia más común: la sucesora no puede iniciar hasta que la predecesora termine (por ejemplo, no se puede pintar una pared hasta que termine de instalarse). SS, FF y SF representan otras combinaciones menos frecuentes de inicio/fin entre actividades.'},
{id:'r20', domain:'process', topic:'Estimación por tres valores (PERT)', q:'Una actividad tiene una estimación optimista de 4 días, más probable de 6 días y pesimista de 14 días. Usando la fórmula PERT beta (ponderada), ¿cuál es la duración esperada aproximada?',
 o:['8 días (promedio simple de los tres valores)','7 días, usando la fórmula (Optimista + 4×Más probable + Pesimista) / 6','14 días, tomando siempre el escenario pesimista','4 días, tomando siempre el escenario optimista'],
 a:1, e:'La fórmula PERT ponderada es (O + 4M + P) / 6 = (4 + 4×6 + 14) / 6 = (4+24+14)/6 = 42/6 = 7 días. Esta fórmula da más peso al valor "más probable" que un simple promedio de los tres escenarios, produciendo una estimación más realista.'},
{id:'r21', domain:'process', topic:'Planificación gradual (rolling wave)', q:'El equipo planifica en detalle las próximas 4 semanas de trabajo, mientras que el trabajo más allá de ese horizonte se mantiene a un nivel general hasta que se acerque el momento de ejecutarlo. Esta técnica se conoce como:',
 o:['Gestión del valor ganado','Planificación gradual (rolling wave planning)','Nivelación de recursos','Ruta crítica'],
 a:1, e:'La planificación gradual (rolling wave) planifica en detalle el trabajo cercano en el tiempo y mantiene el trabajo futuro a un nivel más general, refinándolo progresivamente a medida que se acerca su ejecución y se dispone de más información, forma de elaboración progresiva aplicada al cronograma.'},
// ---- DOMINIO: PROCESO (Gestión del costo — parte 1) ----
{id:'r22', domain:'process', topic:'Valor ganado (EVM) — conceptos base', q:'En la gestión del valor ganado (EVM), ¿qué representa el Valor Ganado (EV - Earned Value)?',
 o:['El costo real incurrido hasta la fecha','El valor presupuestado del trabajo realmente completado hasta la fecha','El valor presupuestado de todo el trabajo planificado para completarse hasta la fecha','El presupuesto total del proyecto'],
 a:1, e:'El Valor Ganado (EV) es el valor presupuestado del trabajo efectivamente completado a una fecha determinada. Se diferencia del Valor Planificado (PV), que es lo que se planeó completar, y del Costo Real (AC), que es lo realmente gastado, independientemente del trabajo hecho.'},
{id:'r23', domain:'process', topic:'Índice de desempeño del costo (CPI)', q:'Un proyecto tiene un EV de 40.000€ y un AC de 50.000€. ¿Cuál es el CPI y qué significa?',
 o:['CPI = 1.25; el proyecto está por debajo del presupuesto','CPI = 0.8; el proyecto está gastando más de lo presupuestado por cada unidad de trabajo completado','CPI = 0.8; el proyecto va adelantado respecto al cronograma','CPI = 1.25; el proyecto va atrasado respecto al cronograma'],
 a:1, e:'CPI = EV/AC = 40.000/50.000 = 0.8. Un CPI menor a 1 indica que el proyecto está gastando más de lo presupuestado por cada unidad de trabajo completado (sobrecosto); un CPI mayor a 1 indicaría eficiencia de costo por encima de lo planeado.'},
{id:'r24', domain:'process', topic:'Índice de desempeño del cronograma (SPI)', q:'Un proyecto tiene un EV de 60.000€ y un PV de 75.000€. ¿Cuál es el SPI y qué indica sobre el cronograma?',
 o:['SPI = 1.25; el proyecto va adelantado','SPI = 0.8; el proyecto va atrasado respecto al cronograma planificado','SPI = 0.8; el proyecto está por encima del presupuesto','SPI = 1.25; no hay información suficiente sobre el cronograma'],
 a:1, e:'SPI = EV/PV = 60.000/75.000 = 0.8. Un SPI menor a 1 indica que el proyecto ha completado menos trabajo del que estaba planificado a esta fecha, es decir, va atrasado en el cronograma. El SPI mide desempeño de cronograma, no de costo.'},
