{id:'r25', domain:'process', topic:'Estimación a la conclusión (EAC)', q:'Un proyecto tiene un Presupuesto Hasta la Conclusión (BAC) de 200.000€ y un CPI de 0.8, y se asume que el desempeño de costo observado hasta ahora continuará igual durante el resto del proyecto. ¿Cuál es la fórmula y el resultado aproximado del EAC?',
 o:['EAC = BAC − CPI = 199.999,2€','EAC = BAC / CPI = 200.000 / 0.8 = 250.000€','EAC = AC + BAC = una cifra mucho mayor sin relación con el CPI','EAC = BAC × CPI = 160.000€'],
 a:1, e:'Cuando se asume que el desempeño de costo actual (CPI) continuará igual durante el resto del proyecto, la fórmula es EAC = BAC / CPI = 200.000 / 0.8 = 250.000€. Esto indica que, de mantenerse la eficiencia actual, el proyecto costará 50.000€ más de lo presupuestado originalmente.'},
{id:'r26', domain:'process', topic:'Estimación hasta la conclusión (ETC)', q:'Si el EAC calculado de un proyecto es 250.000€ y el Costo Real (AC) hasta la fecha es 80.000€, ¿cuál es la Estimación Hasta la Conclusión (ETC)?',
 o:['ETC = EAC − AC = 250.000 − 80.000 = 170.000€','ETC = EAC + AC = 330.000€','ETC = BAC − AC = una cifra distinta sin relación con el EAC','ETC = AC / EAC = 0.32€'],
 a:0, e:'La Estimación Hasta la Conclusión (ETC) representa el costo esperado para completar el trabajo restante, y se calcula como EAC − AC = 250.000 − 80.000 = 170.000€, es decir, lo que falta por gastar según la proyección actual.'},
{id:'r27', domain:'process', topic:'Variación a la conclusión (VAC)', q:'Con un BAC de 200.000€ y un EAC proyectado de 250.000€, ¿cuál es la Variación a la Conclusión (VAC) y qué significa?',
 o:['VAC = BAC − EAC = −50.000€; el proyecto se proyecta 50.000€ por encima del presupuesto original','VAC = EAC − BAC = +50.000€; el proyecto se proyecta por debajo del presupuesto','VAC = BAC + EAC = 450.000€; cifra sin interpretación de desempeño','VAC siempre es igual al CPI multiplicado por el BAC'],
 a:0, e:'VAC = BAC − EAC = 200.000 − 250.000 = −50.000€. Un VAC negativo indica que se proyecta terminar el proyecto por encima del presupuesto original; un VAC positivo indicaría que se espera terminar por debajo del presupuesto.'},
{id:'r28', domain:'process', topic:'Índice de desempeño para completar (TCPI)', q:'¿Qué responde la fórmula del Índice de Desempeño del Trabajo por Completar (TCPI) basada en el BAC: (BAC − EV) / (BAC − AC)?',
 o:['Cuánto dinero queda disponible en la reserva de contingencia','Qué eficiencia de costo se necesita mantener en el trabajo restante para terminar dentro del presupuesto original (BAC)','El porcentaje de avance físico del proyecto','El número de días restantes del proyecto'],
 a:1, e:'El TCPI indica la eficiencia de costo que debe lograrse en el trabajo restante para cumplir un objetivo de costo determinado (BAC o EAC). Cuando (BAC−EV)/(BAC−AC) es mucho mayor que 1, señala que será muy difícil recuperar el presupuesto original sin cambios significativos.'},
{id:'r29', domain:'process', topic:'Línea base de costos vs. presupuesto vs. límite de financiamiento', q:'¿Cuál es la relación correcta entre la línea base de costos, el presupuesto del proyecto y los límites de financiamiento?',
 o:['Son exactamente lo mismo y se usan indistintamente','La línea base de costos es la versión aprobada del presupuesto distribuido en el tiempo (sin reserva de gestión); el presupuesto del proyecto incluye además la reserva de gestión; los límites de financiamiento reflejan cuándo la organización puede desembolsar fondos, lo que puede requerir ajustar el ritmo de gasto','Los límites de financiamiento siempre son ilimitados y no afectan la planificación','La línea base de costos incluye la reserva de gestión, pero el presupuesto no'],
 a:1, e:'La línea base de costos es el presupuesto aprobado distribuido en el tiempo, excluyendo la reserva de gestión. El presupuesto total del proyecto suma la línea base más la reserva de gestión. Los límites de financiamiento (cuánto puede desembolsar la organización y cuándo) pueden obligar a ajustar el ritmo de gasto planificado, incluso si el presupuesto total es suficiente.'},
{id:'r30', domain:'process', topic:'Reserva de contingencia vs. reserva de gestión', q:'¿Cuál es la diferencia entre la reserva de contingencia y la reserva de gestión?',
 o:['Son términos sinónimos para el mismo concepto','La reserva de contingencia cubre riesgos conocidos identificados (known-unknowns) y forma parte de la línea base de costos; la reserva de gestión cubre trabajo no previsto dentro del alcance (unknown-unknowns) y no forma parte de la línea base, requiriendo aprobación para su uso','La reserva de gestión la controla el equipo sin aprobación de nadie más','La reserva de contingencia siempre es mayor que el presupuesto total del proyecto'],
 a:1, e:'La reserva de contingencia se calcula para riesgos identificados (known-unknowns) y se incluye en la línea base de costos. La reserva de gestión cubre trabajo imprevisto dentro del alcance del proyecto (unknown-unknowns), está fuera de la línea base, y su uso normalmente requiere aprobación del patrocinador o de gobernanza.'},
// ---- DOMINIO: PROCESO (Gestión de la calidad) ----
{id:'r31', domain:'process', topic:'Costo de la calidad', q:'Una empresa invierte en capacitación del equipo y revisiones de código para prevenir defectos antes de que ocurran. ¿En qué categoría del costo de la calidad se clasifica esta inversión?',
 o:['Costo de falla interna','Costo de falla externa','Costo de prevención','Costo de evaluación/inspección'],
 a:2, e:'Los costos de prevención buscan evitar que ocurran defectos desde el origen (capacitación, revisiones de diseño, procesos robustos). Se diferencian de los costos de evaluación (inspecciones, pruebas para detectar defectos ya existentes) y de los costos de falla interna/externa (corregir defectos detectados antes o después de la entrega al cliente).'},
{id:'r32', domain:'process', topic:'Diagrama de Pareto', q:'El equipo de calidad identifica que el 80% de los defectos reportados provienen de solo el 20% de los tipos de causa raíz. ¿Qué herramienta utilizaron para llegar a esta conclusión?',
 o:['Diagrama de Ishikawa (espina de pescado)','Diagrama de Pareto','Diagrama de dispersión','Carta de control'],
 a:1, e:'El diagrama de Pareto aplica el principio 80/20 para priorizar los pocos factores vitales que causan la mayoría de los problemas, ordenando las causas de mayor a menor frecuencia/impacto, lo que ayuda a enfocar los esfuerzos de mejora donde tendrán mayor efecto.'},
{id:'r33', domain:'process', topic:'Diagrama de causa y efecto', q:'El equipo se reúne para hacer una lluvia de ideas sobre las posibles causas raíz de un defecto recurrente, organizándolas en categorías como personas, procesos, materiales y equipo. ¿Qué herramienta están usando?',
 o:['Diagrama de Ishikawa (espina de pescado o causa-efecto)','Diagrama de Pareto','Matriz de probabilidad e impacto','Diagrama de red del cronograma'],
 a:0, e:'El diagrama de Ishikawa (espina de pescado o causa-efecto) organiza visualmente las posibles causas raíz de un problema en categorías, ayudando al equipo a explorar sistemáticamente por qué ocurre un defecto en lugar de tratar solo sus síntomas.'},
{id:'r34', domain:'process', topic:'Cartas de control', q:'En una carta de control de un proceso de fabricación, siete puntos consecutivos aparecen todos por encima de la línea central, aunque todos están dentro de los límites de control. Según la "regla de siete", ¿qué debería hacer el equipo?',
 o:['Ignorarlo porque todos los puntos están dentro de los límites de control','Investigar la causa, ya que un patrón de siete puntos consecutivos en el mismo lado de la línea central indica que el proceso probablemente no es aleatorio, aunque esté dentro de los límites','Detener inmediatamente toda la producción sin analizar la causa','Ampliar los límites de control para que el patrón deje de ser visible'],
 a:1, e:'La regla de siete (rule of seven) señala que siete puntos consecutivos en el mismo lado de la línea central sugieren una causa asignable no aleatoria, incluso si todos los puntos individuales están dentro de los límites de control, y amerita investigación antes de que el problema empeore.'},
{id:'r35', domain:'process', topic:'Aseguramiento vs. control de calidad', q:'¿Cuál es la diferencia principal entre el Aseguramiento de la Calidad (QA) y el Control de Calidad (QC)?',
 o:['Son términos idénticos usados indistintamente','El Aseguramiento de la Calidad se enfoca en los procesos usados para producir el entregable (prevención, mejora continua), mientras que el Control de Calidad se enfoca en inspeccionar los entregables específicos para verificar que cumplen los requisitos','El Control de Calidad ocurre siempre antes que el Aseguramiento de la Calidad','El Aseguramiento de la Calidad solo lo realiza un auditor externo'],
 a:1, e:'El Aseguramiento de la Calidad (gestionar la calidad) se centra en los procesos y estándares usados durante todo el proyecto para prevenir defectos; el Control de Calidad se centra en inspeccionar los entregables concretos y medir resultados frente a los requisitos, típicamente al final de una fase o entregable.'},
{id:'r36', domain:'process', topic:'Calidad en entornos ágiles', q:'En un equipo ágil, la calidad se verifica de forma continua mediante pruebas automatizadas ejecutadas en cada integración de código, en lugar de una única fase de pruebas al final del proyecto. ¿Qué principio ágil respalda este enfoque?',
 o:['La documentación exhaustiva es prioritaria sobre el software funcionando','La calidad debe construirse de forma continua durante todo el desarrollo, no verificarse únicamente al final','Los cambios de alcance deben evitarse a toda costa','Solo el cliente puede realizar pruebas de calidad'],
 a:1, e:'Los enfoques ágiles integran la calidad de forma continua a lo largo de todo el desarrollo (pruebas automatizadas, integración continua, revisión por pares) en lugar de dejarla como una fase separada al final, lo que permite detectar y corregir defectos mucho antes y a menor costo.'},
// ---- DOMINIO: PROCESO (Gestión de riesgos) ----
{id:'r37', domain:'process', topic:'Registro de riesgos', q:'¿Qué información NO se incluye típicamente en el registro de riesgos de un proyecto?',
 o:['La descripción del riesgo y su categoría','El propietario del riesgo responsable de monitorearlo y responder','Los detalles completos del salario de cada miembro del equipo','La estrategia de respuesta planificada y el estado actual del riesgo'],
 a:2, e:'El registro de riesgos documenta la descripción, categoría, causa raíz, propietario, probabilidad/impacto, estrategia de respuesta y estado de cada riesgo identificado. La información salarial del equipo no tiene relación con la gestión de riesgos y no pertenece a este documento.'},
{id:'r38', domain:'process', topic:'Matriz de probabilidad e impacto', q:'Un riesgo tiene una probabilidad "alta" de ocurrir y un impacto "alto" si ocurre. Al ubicarlo en la matriz de probabilidad e impacto, ¿qué prioridad de atención debería recibir en comparación con un riesgo de probabilidad "baja" e impacto "bajo"?',
 o:['La misma prioridad, ya que todos los riesgos deben tratarse por igual','Mucha mayor prioridad, ya que la combinación de alta probabilidad y alto impacto genera la mayor exposición al riesgo del proyecto','Menor prioridad, porque los riesgos de alta probabilidad suelen ser más fáciles de ignorar','Ninguna prioridad, ya que solo importan los riesgos con impacto financiero'],
 a:1, e:'La matriz de probabilidad e impacto clasifica los riesgos según la combinación de ambos factores; los riesgos de alta probabilidad y alto impacto se ubican en la zona de mayor exposición y requieren atención prioritaria y respuestas más robustas que los de baja probabilidad y bajo impacto.'},
{id:'r39', domain:'process', topic:'Estrategias de respuesta a riesgos negativos', q:'El equipo decide cancelar un componente opcional del proyecto porque su tecnología subyacente representaba un riesgo inaceptablemente alto de fallo. ¿Qué estrategia de respuesta a riesgos negativos (amenazas) están aplicando?',
 o:['Mitigar','Transferir','Evitar (Avoid)','Aceptar activamente'],
 a:2, e:'Evitar consiste en eliminar la amenaza por completo, cambiando el plan del proyecto para eliminar la causa del riesgo -en este caso, cancelando el componente que introducía el riesgo-, a diferencia de mitigar (reducir probabilidad/impacto sin eliminarlo) o transferir (trasladar el riesgo a un tercero).'},
{id:'r40', domain:'process', topic:'Estrategias de respuesta a riesgos negativos', q:'El equipo contrata un seguro para cubrir las pérdidas financieras en caso de que un proveedor clave incumpla el contrato. ¿Qué estrategia de respuesta a riesgos negativos representa esta acción?',
 o:['Mitigar','Transferir','Evitar','Aceptar pasivamente'],
 a:1, e:'Transferir traslada el impacto financiero (y a veces la responsabilidad) de un riesgo a un tercero, como mediante seguros, garantías o cláusulas contractuales, sin eliminar la probabilidad de que el evento ocurra, solo mitigando su impacto económico para el proyecto.'},
{id:'r41', domain:'process', topic:'Estrategias de respuesta a riesgos positivos', q:'El equipo identifica una oportunidad de usar una nueva biblioteca de código que podría acelerar el desarrollo, y decide asignar a su desarrollador más experimentado exclusivamente a esa tarea para maximizar la probabilidad de captar el beneficio. ¿Qué estrategia de respuesta a riesgos positivos (oportunidades) es esta?',
 o:['Explotar (Exploit)','Evitar','Transferir','Aceptar pasivamente'],
 a:0, e:'Explotar busca asegurar que una oportunidad definitivamente se materialice, eliminando la incertidumbre asociada -por ejemplo, asignando los mejores recursos disponibles a la tarea-, siendo el equivalente positivo de la estrategia "evitar" para amenazas.'},
{id:'r42', domain:'process', topic:'Valor monetario esperado (EMV)', q:'Un riesgo tiene un 30% de probabilidad de generar una pérdida de 40.000€ si ocurre. ¿Cuál es su Valor Monetario Esperado (EMV)?',
 o:['EMV = -40.000€ (la pérdida completa)','EMV = -12.000€ (0.30 × -40.000€)','EMV = -70.000€ (suma de probabilidad e impacto)','EMV = -133.333€ (40.000€ / 0.30)'],
 a:1, e:'El Valor Monetario Esperado se calcula multiplicando la probabilidad del riesgo por su impacto monetario: 0.30 × (-40.000€) = -12.000€. Este valor se usa para calcular la reserva de contingencia agregada y comparar el impacto relativo de distintos riesgos entre sí.'},
{id:'r43', domain:'process', topic:'Disparadores de riesgo', q:'El equipo define de antemano que "si el retraso en la entrega de un componente supera las dos semanas" se activará automáticamente el plan de contingencia. ¿Cómo se denomina esta señal predefinida?',
 o:['Reserva de gestión','Disparador de riesgo (risk trigger)','Registro de incidentes','Línea base de costos'],
 a:1, e:'Un disparador de riesgo (trigger) es una señal o evento predefinido que indica que un riesgo está a punto de ocurrir o ya ha ocurrido, activando la respuesta planificada. Definir disparadores claros de antemano permite reaccionar de forma proactiva en lugar de improvisar bajo presión.'},
{id:'r44', domain:'process', topic:'Riesgos secundarios y residuales', q:'Al implementar una respuesta de mitigación para un riesgo, aparece un nuevo riesgo derivado directamente de esa respuesta. ¿Cómo se denomina este nuevo riesgo?',
 o:['Riesgo residual','Riesgo secundario','Riesgo aceptado pasivamente','Riesgo desconocido (unknown-unknown)'],
 a:1, e:'Un riesgo secundario surge directamente como consecuencia de implementar una respuesta a otro riesgo. Se diferencia del riesgo residual, que es el riesgo que permanece después de aplicar una respuesta (por ejemplo, el riesgo remanente aunque se haya mitigado parcialmente el original).'},
{id:'r45', domain:'process', topic:'Riesgos en entornos ágiles', q:'Al inicio de un proyecto ágil, el equipo dedica una iteración corta específicamente a investigar una tecnología nueva y desconocida antes de comprometerse a construir sobre ella, para reducir la incertidumbre técnica. ¿Cómo se conoce comúnmente esta práctica?',
 o:['Retrospectiva','Spike (investigación técnica)','Daily Scrum','Revisión de sprint'],
 a:1, e:'Un "spike" es una iteración o tarea de investigación acotada en el tiempo, dedicada a explorar una incógnita técnica o de diseño antes de comprometerse a construir una solución completa, siendo una técnica ágil habitual de gestión proactiva de riesgos e incertidumbre.'},
// ---- DOMINIO: PROCESO (Gestión de adquisiciones) ----
{id:'r46', domain:'process', topic:'Tipos de contrato', q:'Un comprador quiere transferir el máximo riesgo de sobrecosto al vendedor, pagando un precio fijo acordado sin importar los costos reales del vendedor. ¿Qué tipo de contrato es más apropiado?',
 o:['Costo Reembolsable con Honorario Fijo (CPFF)','Precio Fijo Cerrado (FFP - Firm Fixed Price)','Tiempo y Materiales (T&M)','Costo Reembolsable con Honorario de Incentivo (CPIF)'],
 a:1, e:'En un contrato de Precio Fijo Cerrado (FFP), el vendedor asume la mayor parte del riesgo de costo, ya que recibe un precio fijo acordado independientemente de sus costos reales. Es adecuado cuando el alcance está bien definido y hay poca incertidumbre.'},
{id:'r47', domain:'process', topic:'Tipos de contrato', q:'El alcance del trabajo es muy incierto y podría cambiar significativamente durante el proyecto, por lo que el comprador acepta reembolsar los costos del vendedor más un honorario fijo acordado de antemano. ¿Qué tipo de contrato es este?',
 o:['Precio Fijo con Ajuste Económico de Precio (FP-EPA)','Costo Reembolsable con Honorario Fijo (CPFF - Cost Plus Fixed Fee)','Precio Fijo Cerrado (FFP)','Tiempo y Materiales (T&M)'],
 a:1, e:'En un contrato de Costo Reembolsable con Honorario Fijo (CPFF), el comprador asume más riesgo de costo porque reembolsa los costos reales del vendedor, mientras que el honorario del vendedor permanece fijo. Es útil cuando el alcance es incierto y no se puede fijar un precio de antemano con confianza.'},
{id:'r48', domain:'process', topic:'Tipos de contrato', q:'Se necesita contratar a un consultor externo por unas semanas para una tarea de alcance poco definido, pagándole por hora trabajada más materiales usados. ¿Qué tipo de contrato es más apropiado?',
 o:['Precio Fijo Cerrado (FFP)','Tiempo y Materiales (T&M)','Costo Reembolsable con Honorario de Incentivo (CPIF)','Precio Fijo con Incentivo (FPIF)'],
 a:1, e:'Los contratos de Tiempo y Materiales (T&M) son híbridos, adecuados para trabajos de alcance poco definido y corta duración, donde se paga una tarifa por hora/unidad más el costo de materiales, sin comprometerse a un precio ni alcance totalmente fijo desde el inicio.'},
{id:'r49', domain:'process', topic:'Análisis de fabricar o comprar', q:'El equipo evalúa si es más rentable desarrollar internamente un componente de software o comprarlo a un proveedor externo, comparando costos, tiempo y capacidades internas. ¿Cómo se llama este análisis?',
 o:['Análisis de fabricar o comprar (make-or-buy analysis)','Análisis de valor ganado','Análisis de causa raíz','Análisis de sensibilidad'],
 a:0, e:'El análisis de fabricar o comprar (make-or-buy) evalúa si es más conveniente que el propio equipo del proyecto desarrolle un producto o servicio, o si resulta más eficiente adquirirlo externamente, considerando costo, capacidad interna, tiempo disponible y riesgo.'},
{id:'r50', domain:'process', topic:'Selección de proveedores', q:'Al evaluar propuestas de varios proveedores, el equipo de adquisiciones no elige automáticamente al proveedor más barato, sino que pondera también experiencia técnica, referencias y capacidad financiera. ¿Qué está utilizando el equipo?',
 o:['Un sistema de ponderación de criterios de selección de proveedores','Solo el criterio de precio más bajo','Un contrato de precio fijo cerrado obligatorio','Una carta de acuerdo informal'],
 a:0, e:'Un sistema de ponderación pondera distintos criterios de selección (precio, experiencia técnica, capacidad de gestión, referencias, garantías) para evaluar propuestas de forma más completa que fijarse únicamente en el precio más bajo, lo que reduce el riesgo de elegir un proveedor inadecuado.'},
{id:'r51', domain:'process', topic:'Documentos de adquisición', q:'El comprador necesita obtener propuestas detalladas de varios proveedores, incluyendo enfoque técnico y precio, para un trabajo complejo y de alcance parcialmente definido. ¿Qué documento de adquisición es más apropiado emitir?',
 o:['Solicitud de Información (RFI - Request for Information)','Solicitud de Cotización (RFQ - Request for Quotation)','Solicitud de Propuesta (RFP - Request for Proposal)','Orden de compra directa sin proceso competitivo'],
 a:2, e:'Una Solicitud de Propuesta (RFP) se usa cuando el trabajo es complejo y se necesita que los proveedores propongan tanto su enfoque técnico como comercial. La RFQ se usa típicamente para bienes/servicios estandarizados donde solo interesa el precio, y la RFI para recabar información preliminar del mercado.'},
{id:'r52', domain:'process', topic:'Cierre de adquisiciones', q:'Al finalizar un contrato con un proveedor, el equipo verifica que todos los entregables fueron aceptados formalmente y documenta las lecciones aprendidas de la relación contractual antes de cerrar el contrato administrativamente. ¿Por qué es importante este paso, incluso si el proyecto no ha terminado completamente?',
 o:['No es importante, los contratos se cierran automáticamente sin ninguna verificación','Formaliza la aceptación del trabajo, protege legalmente a ambas partes y captura conocimiento útil para futuras adquisiciones, independientemente del estado general del proyecto','Solo se requiere si el proveedor lo solicita explícitamente','Sustituye la necesidad de cerrar formalmente el proyecto completo'],
 a:1, e:'El cierre de las adquisiciones es un proceso independiente del cierre del proyecto completo: verifica que el trabajo contratado fue aceptado, resuelve cualquier reclamación pendiente, documenta lecciones aprendidas y formaliza el fin de las obligaciones contractuales, protegiendo a ambas partes legalmente.'},
// ---- DOMINIO: PROCESO (Comunicaciones e interesados) ----
{id:'r53', domain:'process', topic:'Canales de comunicación', q:'Un proyecto crece de 6 a 10 miembros del equipo. Usando la fórmula de canales de comunicación n(n-1)/2, ¿cuántos canales de comunicación potenciales existen ahora, y cuál era la cantidad con 6 miembros?',
 o:['45 canales con 10 miembros; 15 canales con 6 miembros','20 canales con 10 miembros; 12 canales con 6 miembros','10 canales con 10 miembros; 6 canales con 6 miembros','100 canales con 10 miembros; 36 canales con 6 miembros'],
 a:0, e:'Con n=10: 10×9/2 = 45 canales. Con n=6: 6×5/2 = 15 canales. La fórmula muestra que los canales de comunicación crecen de forma cuadrática, no lineal, al agregar miembros al equipo, lo que justifica invertir en estructuras y herramientas de comunicación más robustas conforme crece el equipo.'},
{id:'r54', domain:'process', topic:'Planificación de la comunicación', q:'Un proyecto internacional tiene interesados que hablan distintos idiomas y con distintos niveles de familiaridad con la terminología técnica. ¿Qué debería considerar principalmente el plan de gestión de las comunicaciones?',
 o:['Usar siempre el mismo formato técnico y el mismo idioma para todos, sin excepciones','Adaptar el idioma, el nivel de detalle técnico y el formato de los mensajes a las necesidades específicas de cada grupo de interesados','Comunicarse únicamente por correo electrónico con todos los interesados','Eliminar la comunicación con los interesados que no dominen el idioma principal del proyecto'],
 a:1, e:'Un plan de comunicaciones eficaz identifica las necesidades específicas de información de cada interesado -incluyendo idioma, nivel técnico, formato y frecuencia preferidos- y adapta los mensajes en consecuencia, en lugar de aplicar un enfoque único para todos, lo que mejora la comprensión y reduce malentendidos.'},
{id:'r55', domain:'process', topic:'Informes de estado vs. escalado', q:'El director de proyecto detecta una variación de costo que supera el umbral definido en el plan de gestión de costos como motivo de escalado. ¿Cuál es la acción MÁS apropiada?',
 o:['Incluirlo únicamente en el próximo informe de estado mensual sin ninguna acción adicional','Escalar la variación según el proceso definido en el plan de gestión (por ejemplo, notificar al patrocinador o comité de gobernanza) además de documentarla','Ignorar la variación si el proyecto sigue teniendo margen de tiempo','Modificar la línea base de costos unilateralmente sin aprobación'],
 a:1, e:'Cuando una variación supera un umbral predefinido de escalado, el plan de gestión correspondiente (costos, cronograma, etc.) normalmente exige notificar formalmente a los niveles de gobernanza apropiados, más allá de simplemente reportarlo en el informe de estado periódico.'},
{id:'r56', domain:'process', topic:'Plan de gestión de las comunicaciones', q:'¿Cuál de los siguientes elementos forma parte típicamente del plan de gestión de las comunicaciones?',
 o:['El presupuesto total aprobado del proyecto','Quién necesita qué información, en qué formato, con qué frecuencia y a través de qué método','La lista de riesgos técnicos identificados','Los tipos de contrato usados con los proveedores'],
 a:1, e:'El plan de gestión de las comunicaciones documenta cómo se planificará, estructurará, monitoreará y controlará la comunicación: quién necesita qué información, en qué formato, con qué frecuencia, por qué canal y quién es responsable de comunicarla, entre otros elementos.'},
{id:'r57', domain:'process', topic:'Registro de interesados', q:'¿Cuál es el propósito principal del registro de interesados y por qué debe actualizarse durante todo el proyecto?',
 o:['Documentar identificación, evaluación e información de clasificación de los interesados; debe actualizarse porque los interesados y su influencia pueden cambiar a lo largo del proyecto','Sustituir la necesidad del plan de gestión de interesados','Es un documento estático que se crea una sola vez al inicio y nunca cambia','Solo incluye a los interesados externos a la organización'],
 a:0, e:'El registro de interesados documenta la identificación, evaluación y clasificación (poder, interés, influencia) de cada interesado. Dado que las relaciones, el interés y la influencia de los interesados evolucionan durante el proyecto, este registro debe revisarse y actualizarse periódicamente, no ser un documento estático de una sola vez.'},
{id:'r58', domain:'process', topic:'Matriz de evaluación de la participación de interesados', q:'El director de proyecto documenta el nivel de compromiso actual de cada interesado (desconocedor, resistente, neutral, de apoyo, líder) junto con el nivel deseado, para identificar brechas a cerrar. ¿Qué herramienta está utilizando?',
 o:['Matriz de evaluación de la participación de los interesados','Matriz de asignación de responsabilidades (RACI)','Diagrama de Pareto','Registro de riesgos'],
 a:0, e:'La matriz de evaluación de la participación de los interesados compara el nivel de compromiso actual de cada interesado con el nivel deseado, permitiendo al director de proyecto identificar brechas y diseñar estrategias específicas para mover a cada interesado hacia el nivel deseado.'},
{id:'r59', domain:'process', topic:'Compromiso temprano de interesados', q:'¿Por qué se recomienda identificar y comprometer a los interesados clave lo antes posible en el ciclo de vida del proyecto, en lugar de esperar a que surjan problemas?',
 o:['Porque la guía del PMBOK lo exige como trámite administrativo sin beneficio real','Porque involucrarlos temprano permite anticipar expectativas, reducir resistencia y prevenir cambios costosos que surgirían si sus necesidades se descubrieran tarde','Porque reduce el número total de interesados del proyecto','Porque elimina por completo la necesidad de un plan de gestión de interesados'],
 a:1, e:'Identificar y comprometer a los interesados desde el inicio permite anticipar sus expectativas y preocupaciones, incorporarlas en la planificación y reducir el riesgo de cambios costosos o resistencia significativa que surgirían si sus necesidades se descubren tarde en el proyecto, cuando el costo del cambio es mayor.'},
// ---- DOMINIO: PROCESO (Gestión de cambios) ----
{id:'r60', domain:'process', topic:'Comité de control de cambios', q:'¿Cuál es la función principal de un Comité de Control de Cambios (Change Control Board - CCB)?',
 o:['Ejecutar directamente las tareas técnicas de cada cambio aprobado','Revisar, evaluar y aprobar, rechazar o diferir formalmente las solicitudes de cambio al proyecto','Reemplazar al patrocinador en la toma de decisiones estratégicas de la organización','Aprobar automáticamente todos los cambios solicitados por el cliente sin análisis'],
 a:1, e:'El CCB es un grupo formalmente constituido responsable de revisar las solicitudes de cambio y decidir si se aprueban, rechazan o difieren, basándose en el análisis de impacto. No ejecuta el trabajo técnico ni sustituye la autoridad estratégica del patrocinador, sino que gobierna el proceso de cambio.'},
{id:'r61', domain:'process', topic:'Solicitudes de cambio no autorizadas', q:'Un miembro del equipo, presionado por un interesado, realiza un cambio de alcance sin pasar por el control de cambios formal. ¿Cuál es la acción MÁS apropiada del director de proyecto al descubrirlo?',
 o:['Aceptar el cambio como definitivo sin más análisis, ya que ya se implementó','Evaluar el impacto del cambio ya realizado, documentarlo formalmente a través del proceso de control de cambios (retroactivamente si es necesario) y reforzar el proceso correcto con el equipo','Despedir inmediatamente al miembro del equipo sin ninguna conversación','Revertir el cambio automáticamente sin evaluar su impacto ni valor'],
 a:1, e:'Aunque el cambio ya se implementó, debe documentarse y evaluarse formalmente a través del proceso de control de cambios para entender su impacto real en las líneas base, y el director de proyecto debe reforzar con el equipo la importancia de seguir el proceso establecido para cambios futuros.'},
{id:'r62', domain:'process', topic:'Gestión de la configuración', q:'¿Cuál es la diferencia principal entre la gestión de la configuración y el control integrado de cambios?',
 o:['Son exactamente el mismo proceso con nombres distintos','La gestión de la configuración se enfoca en especificar y controlar las características funcionales y físicas de los entregables y documentos del proyecto (versión, estado), mientras que el control de cambios se enfoca en identificar, documentar y decidir sobre las solicitudes de cambio a las líneas base','La gestión de la configuración solo aplica a proyectos de software','El control de cambios ocurre únicamente después de que el proyecto termina'],
 a:1, e:'La gestión de la configuración administra y controla los cambios a las características de los entregables y documentos (versiones, líneas base de producto), asegurando consistencia; el control integrado de cambios administra el proceso de evaluación y aprobación de las solicitudes de cambio en sí, sobre las líneas base del proyecto. Ambos trabajan juntos pero tienen focos distintos.'},
{id:'r63', domain:'process', topic:'Análisis de impacto de cambios', q:'Antes de que el Comité de Control de Cambios decida sobre una solicitud de cambio, el director de proyecto prepara un análisis de cómo afectaría al cronograma, costo, calidad y riesgos del proyecto. ¿Por qué es esencial este paso?',
 o:['Es opcional y puede omitirse si el cambio parece simple a primera vista','Permite tomar una decisión informada considerando todos los efectos del cambio, evitando aprobar cambios cuyo impacto real se desconoce','Solo se requiere para cambios solicitados por el patrocinador','Sustituye la necesidad de que el CCB se reúna formalmente'],
 a:1, e:'Un análisis de impacto integral, aunque el cambio parezca pequeño, es esencial porque revela efectos en cadena sobre otras áreas del proyecto (por ejemplo, un cambio de alcance menor puede afectar dependencias críticas del cronograma), permitiendo al CCB decidir con información completa en lugar de suposiciones.'},
{id:'r64', domain:'process', topic:'Cambios en entornos ágiles', q:'Un cliente solicita un cambio significativo de prioridades en el backlog a mitad del proyecto ágil. ¿Cómo se maneja típicamente este tipo de solicitud en un entorno Scrum, en comparación con un proyecto predictivo?',
 o:['Se rechaza automáticamente porque los entornos ágiles no permiten cambios','Requiere la aprobación de un Comité de Control de Cambios formal antes de cualquier ajuste','El Product Owner puede reordenar el Product Backlog para el próximo sprint sin necesidad de un proceso formal de control de cambios, siempre que no interrumpa el sprint en curso','Solo puede implementarse al final de todo el proyecto'],
 a:2, e:'Los enfoques ágiles dan la bienvenida al cambio, incluso tarde en el desarrollo, como principio central del Manifiesto Ágil. El Product Owner puede reordenar el backlog libremente para futuros sprints; sin embargo, generalmente se evita interrumpir un sprint ya en curso para proteger el compromiso y el enfoque del equipo.'},
// ---- DOMINIO: PROCESO (Gestión de incidencias) ----
{id:'r65', domain:'process', topic:'Registro de incidencias', q:'¿Cuál es el propósito principal de un registro de incidencias (issue log) en un proyecto?',
 o:['Documentar únicamente los riesgos que aún no han ocurrido','Documentar y hacer seguimiento a problemas actuales que requieren resolución, asignando responsables y fechas objetivo','Sustituir el plan de gestión de riesgos','Registrar solamente las decisiones tomadas por el patrocinador'],
 a:1, e:'El registro de incidencias (issue log) documenta problemas que ya están ocurriendo actualmente y necesitan resolución, asignando un responsable y una fecha objetivo para su cierre, permitiendo dar seguimiento activo hasta que se resuelvan.'},
{id:'r66', domain:'process', topic:'Riesgo vs. incidencia', q:'¿Cuál es la diferencia fundamental entre un "riesgo" y una "incidencia" (issue) en la gestión de proyectos?',
 o:['Son sinónimos y se documentan en el mismo registro sin diferencia','Un riesgo es un evento incierto que podría ocurrir en el futuro y afectar al proyecto (positiva o negativamente); una incidencia es un problema que ya está ocurriendo actualmente y requiere resolución','Las incidencias solo pueden ser positivas, los riesgos solo negativos','Los riesgos se gestionan solo en la ejecución, las incidencias solo en el cierre'],
 a:1, e:'Un riesgo es una condición o evento incierto que, si ocurre, tendrá un efecto (positivo o negativo) en los objetivos del proyecto; una incidencia (issue) es un asunto o problema que ya está sucediendo en el presente y requiere gestión activa hasta su resolución, no meramente su monitoreo.'},
{id:'r67', domain:'process', topic:'Escalado de incidencias', q:'Una incidencia registrada no puede resolverse dentro de la autoridad del director de proyecto porque requiere una decisión sobre el presupuesto general de la organización. ¿Cuál es la acción correcta?',
 o:['Ignorar la incidencia hasta que se resuelva sola','Escalarla formalmente al nivel de gobernanza o patrocinador apropiado, con la información y opciones necesarias para que puedan decidir','Tomar la decisión unilateralmente aunque exceda su autoridad formal','Eliminarla del registro de incidencias porque no se puede resolver'],
 a:1, e:'Cuando una incidencia excede la autoridad del director de proyecto, debe escalarse formalmente al nivel de gobernanza adecuado (patrocinador, comité directivo), presentando el contexto, opciones y recomendación, en lugar de ignorarla, ocultarla o tomar decisiones fuera de su autoridad.'},
// ---- DOMINIO: PROCESO (Gobernanza) ----
{id:'r68', domain:'process', topic:'Gobernanza del proyecto', q:'¿Qué propósito cumple un marco de gobernanza del proyecto?',
 o:['Define exclusivamente el cronograma detallado de actividades','Proporciona la estructura, las funciones, responsabilidades, políticas y procedimientos para la toma de decisiones y la rendición de cuentas dentro del proyecto','Sustituye la necesidad de un director de proyecto','Aplica únicamente a proyectos del sector público'],
 a:1, e:'La gobernanza del proyecto establece la estructura organizativa, roles, políticas y procesos de toma de decisiones que guían cómo se dirige, controla y supervisa el proyecto, asegurando alineación con los objetivos estratégicos de la organización y una clara rendición de cuentas.'},
{id:'r69', domain:'process', topic:'Comité directivo', q:'¿Cuál es el rol típico de un comité directivo (steering committee) en un proyecto grande?',
 o:['Ejecutar directamente las tareas operativas diarias del proyecto','Proporcionar supervisión de alto nivel, tomar decisiones estratégicas clave y resolver escalados que exceden la autoridad del director de proyecto','Reemplazar completamente al equipo de proyecto en la ejecución técnica','Redactar el registro de riesgos operativo del día a día'],
 a:1, e:'Un comité directivo proporciona supervisión estratégica de alto nivel, aprueba decisiones clave (financiamiento adicional, cambios mayores de alcance) y sirve como punto de escalado para asuntos que exceden la autoridad del director de proyecto, sin involucrarse en la ejecución operativa diaria.'},
{id:'r70', domain:'process', topic:'Matriz de autoridad/decisión', q:'El proyecto documenta explícitamente quién tiene autoridad para aprobar cambios de presupuesto por debajo de 10.000€ y quién debe aprobar cambios mayores. ¿Qué herramienta de gobernanza está usando el proyecto?',
 o:['Registro de interesados','Matriz de autoridad o umbrales de decisión','Diagrama de Ishikawa','Curva S de valor ganado'],
 a:1, e:'Una matriz de autoridad o de umbrales de decisión documenta claramente qué nivel de la organización o del proyecto tiene autoridad para aprobar distintos tipos y magnitudes de decisiones, reduciendo ambigüedad y acelerando la toma de decisiones dentro de los límites correctos.'},
// ---- DOMINIO: PROCESO (Artefactos, cierre y transferencia de conocimiento) ----
{id:'r71', domain:'process', topic:'Registro de lecciones aprendidas', q:'¿Cuándo debería actualizarse el registro de lecciones aprendidas de un proyecto?',
 o:['Únicamente en la reunión de cierre, al final del proyecto','De forma continua durante todo el ciclo de vida del proyecto, no solo al final, para capturar el conocimiento mientras está fresco y aplicarlo en el propio proyecto en curso','Solo si el proyecto falla completamente','Nunca; es responsabilidad exclusiva de la oficina de proyectos (PMO) crearlo al final'],
 a:1, e:'Las lecciones aprendidas deben capturarse de forma continua a lo largo de todo el proyecto -no solo en una reunión de cierre-, lo que permite aplicar mejoras dentro del propio proyecto en curso y no depender de la memoria del equipo meses después, cuando gran parte del contexto ya se ha perdido.'},
{id:'r72', domain:'process', topic:'Actualización del plan de dirección del proyecto', q:'A mitad del proyecto se aprueba un cambio significativo de alcance a través del control integrado de cambios. ¿Qué debe ocurrir con el plan para la dirección del proyecto y sus líneas base?',
 o:['El plan y las líneas base permanecen sin cambios, ya que se congelan al inicio del proyecto','El plan para la dirección del proyecto y las líneas base afectadas deben actualizarse para reflejar el cambio aprobado, manteniendo la trazabilidad del cambio','Se debe crear un proyecto completamente nuevo con un nuevo acta de constitución','Solo el registro de riesgos necesita actualizarse, nada más'],
 a:1, e:'Una vez aprobado un cambio a través del control integrado de cambios, el plan para la dirección del proyecto y las líneas base afectadas (alcance, cronograma, costo) deben actualizarse formalmente para reflejar la nueva realidad aprobada, manteniendo un registro trazable del cambio.'},
{id:'r73', domain:'process', topic:'Cierre del proyecto o fase', q:'¿Cuál de las siguientes NO es una actividad típica del cierre formal de un proyecto o fase?',
 o:['Confirmar que todo el trabajo y los entregables fueron aceptados formalmente por el cliente o patrocinador','Liberar los recursos del proyecto y actualizar los activos de los procesos de la organización','Iniciar la ejecución de nuevas actividades de desarrollo no contempladas en el alcance original','Documentar las lecciones aprendidas finales y archivar la documentación del proyecto'],
 a:2, e:'El cierre de un proyecto o fase incluye confirmar la aceptación formal de entregables, liberar recursos, archivar documentación y capturar lecciones aprendidas finales. Iniciar nuevas actividades de desarrollo no planificadas no corresponde al cierre, sino que representaría un nuevo alcance o proyecto que requeriría su propia autorización.'},
{id:'r74', domain:'process', topic:'Cierre administrativo vs. de contrato', q:'¿Cuál es la diferencia entre el cierre administrativo del proyecto y el cierre de las adquisiciones (contratos)?',
 o:['Son el mismo proceso realizado en el mismo momento siempre','El cierre administrativo abarca todas las actividades de cierre del proyecto completo (archivo, liberación de recursos, aceptación final); el cierre de adquisiciones se refiere específicamente a finalizar formalmente cada contrato individual con proveedores, y puede ocurrir antes de que termine todo el proyecto','El cierre de adquisiciones siempre ocurre después del cierre administrativo, nunca antes','El cierre administrativo solo aplica a proyectos gubernamentales'],
 a:1, e:'El cierre de las adquisiciones finaliza formalmente cada contrato individual (verificación de entregables, resolución de reclamaciones) y puede completarse en distintos momentos a lo largo del proyecto, según cuándo termine cada contrato; el cierre administrativo del proyecto engloba el cierre general de todo el proyecto o fase al final.'},
{id:'r75', domain:'process', topic:'Transferencia de conocimiento', q:'Antes de que el equipo del proyecto se disuelva, el director de proyecto organiza sesiones donde los expertos técnicos documentan y explican decisiones de diseño clave al equipo de soporte que mantendrá el producto. ¿Qué tipo de conocimiento es MÁS difícil de transferir con documentación escrita únicamente, y por qué se organizan estas sesiones?',
 o:['Conocimiento explícito, porque siempre requiere una reunión presencial obligatoria','Conocimiento tácito (experiencia, intuición, razones no documentadas detrás de decisiones), porque se transfiere mejor mediante interacción directa, mentoría y conversación que mediante documentos escritos','Ningún tipo de conocimiento requiere sesiones adicionales si existe documentación','Conocimiento financiero, porque es el único que importa al cierre del proyecto'],
 a:1, e:'El conocimiento explícito (procedimientos, manuales) se documenta fácilmente por escrito, pero el conocimiento tácito -experiencia, juicio, razones no escritas detrás de decisiones- se transfiere mucho mejor mediante interacción directa, mentoría y conversación, razón por la cual estas sesiones son clave antes de disolver el equipo.'},
// ---- DOMINIO: ENTORNO DE NEGOCIO ----
{id:'b01', domain:'business', topic:'Cumplimiento normativo', q:'Un proyecto de software para el sector financiero debe cumplir con regulaciones de protección de datos. ¿Cuál es la mejor práctica respecto al cumplimiento normativo?',
 o:['Abordar el cumplimiento solo al final del proyecto, antes del lanzamiento','Identificar los requisitos de cumplimiento aplicables desde la planificación inicial e integrarlos en los requisitos y el plan del proyecto','Delegar todo el cumplimiento al departamento legal sin ninguna coordinación con el equipo de proyecto','Ignorar el cumplimiento si el cliente no lo menciona explícitamente'],
 a:1, e:'El cumplimiento normativo debe identificarse e integrarse desde la planificación temprana del proyecto, ya que los requisitos regulatorios suelen afectar el diseño, la arquitectura y los procesos, y corregirlo tarde resulta mucho más costoso que planificarlo desde el inicio, coordinando con las áreas legales pero sin delegar toda la responsabilidad.'},
{id:'b02', domain:'business', topic:'Cumplimiento normativo', q:'¿Cuál es el propósito principal de realizar auditorías de cumplimiento durante un proyecto sujeto a regulación?',
 o:['Sustituir la necesidad de control de calidad del producto','Verificar de forma independiente que el proyecto cumple con las políticas, estándares y regulaciones aplicables, identificando desviaciones a tiempo','Aumentar artificialmente la duración del proyecto','Evaluar únicamente el desempeño individual de los miembros del equipo'],
 a:1, e:'Las auditorías de cumplimiento verifican de forma objetiva e independiente que el proyecto sigue las políticas, estándares y regulaciones aplicables, permitiendo detectar y corregir desviaciones antes de que se conviertan en problemas legales o de negocio graves.'},
{id:'b03', domain:'business', topic:'Riesgos de incumplimiento', q:'El equipo descubre que un proceso interno del proyecto no cumple con una regulación de la industria recientemente actualizada. ¿Cuál es la acción MÁS apropiada del director de proyecto?',
 o:['Ignorarlo si corregirlo retrasaría el cronograma del proyecto','Evaluar el impacto, informar a los interesados apropiados (legal, patrocinador) y ajustar el plan del proyecto para lograr el cumplimiento, incluso si afecta el cronograma o costo','Ocultarlo hasta después del cierre del proyecto para evitar conflictos','Delegar la decisión final únicamente al equipo técnico sin informar a la gerencia'],

/* ============================================================
   ESTADO Y PERSISTENCIA
   ============================================================ */
const DOMAIN_META = {
  people:   { label:'Personas',       weight:42, color:'var(--people)'   },
  process:  { label:'Proceso',        weight:50, color:'var(--process)'  },
  business: { label:'Entorno de negocio', weight:8, color:'var(--business)' }
};

let STATS = null; // { attempts:{id:{seen,correct}}, exams:[{date,score,total,domainBreakdown}] }
const STORAGE_KEY = 'pmp-exam-prep-stats-v1';

function loadStats(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    STATS = raw ? JSON.parse(raw) : null;
  }catch(e){ STATS = null; }
  if(!STATS){
    STATS = { attempts:{}, exams:[] };
  }
}
function saveStats(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATS));
  }catch(e){
    console.error('No se pudo guardar el progreso localmente', e);
    alert('No se ha podido guardar tu progreso en este navegador. Si estás en modo incógnito o privado, cámbialo a modo normal para que tus resultados se guarden.');
  }
}
function exportProgress(){
  const blob = new Blob([JSON.stringify(STATS,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pmp-progreso-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.attempts || !data.exams) throw new Error('Formato no válido');
      STATS = data;
      saveStats();
      alert('Progreso importado correctamente.');
      renderHistoryView();
    }catch(err){
      alert('El archivo seleccionado no es un backup de progreso válido.');
    }
  };
  reader.readAsText(file);
}
function recordAttempt(qid, correct){
  const rec = STATS.attempts[qid] || { seen:0, correct:0 };
  rec.seen += 1;
  if(correct) rec.correct += 1;
  STATS.attempts[qid] = rec;
}
function domainStats(domain){
  const ids = QUESTIONS.filter(q=>q.domain===domain).map(q=>q.id);
  let seen=0, correct=0;
  ids.forEach(id=>{
    const r = STATS.attempts[id];
    if(r){ seen += r.seen; correct += r.correct; }
  });
  return { seen, correct, total: ids.length };
}
function overallStats(){
  let seen=0, correct=0, attemptedQ=0;
  Object.values(STATS.attempts).forEach(r=>{ seen+=r.seen; correct+=r.correct; attemptedQ+=1; });
  return { seen, correct, attemptedQ };
}

/* ============================================================
   NAVEGACIÓN / RENDER RAÍZ
   ============================================================ */
const view = document.getElementById('view');
document.getElementById('homeBtn').addEventListener('click', renderDashboard);

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- DASHBOARD ---------- */
function coverageRowsHTML(){
  return Object.entries(DOMAIN_META).map(([key,meta])=>{
    const ds = domainStats(key);
    const pct = ds.seen ? Math.round((ds.correct/ds.seen)*100) : 0;
    const detail = ds.seen ? `${pct}% de aciertos (${ds.correct}/${ds.seen} respuestas)` : 'Aún sin practicar';
    return `<div class="coverage-row">
      <div class="coverage-label"><span>${meta.label}</span><b>${meta.weight}% del examen</b></div>
      <div class="coverage-track"><div class="coverage-fill" style="width:${pct}%; background:${meta.color};"></div></div>
      <div class="coverage-pct">${ds.seen? pct+'%':'—'}</div>
    </div>
    <div class="sub" style="margin:-8px 0 12px 0; font-size:12.5px;">${meta.label}: ${detail} · ${ds.total} preguntas en el banco</div>`;
  }).join('');
}

function renderDashboard(){
  const examOptions = [20,40,60,90,120,QUESTIONS.length].filter((v,i,a)=>a.indexOf(v)===v && v<=QUESTIONS.length);

  view.innerHTML='';

  // Bloque 1: bienvenida breve
  view.appendChild(el(`
    <div class="plate" style="text-align:center;">
      <span class="eyebrow">150 preguntas · 3 dominios PMP</span>
      <h2>¿Qué quieres hacer hoy?</h2>
      <p class="sub" style="margin:0 auto;">Elige un modo para empezar, o consulta tus resultados y tu evolución en el histórico.</p>
    </div>
  `));

  // Bloque 2: los tres botones de acción
  view.appendChild(el(`
    <div class="mode-grid">
      <button class="mode-card secondary" id="goHistory">
        <span class="tag">RESULTADOS</span>
        <h3>Historial y estadísticas</h3>
        <p>Tu progreso por dominio, la evolución de tus notas y el detalle de cada examen simulado que hayas completado.</p>
      </button>
      <button class="mode-card" id="goPractice">
        <span class="tag">MODO PRÁCTICA</span>
        <h3>Práctica con feedback inmediato</h3>
        <p>Responde una a una. Cada pregunta se corrige al instante con el razonamiento de por qué la opción correcta lo es y por qué las demás no.</p>
      </button>
      <button class="mode-card" id="goExam">
        <span class="tag">MODO EXAMEN SIMULADO</span>
        <h3>Bloque cronometrado</h3>
        <p>Sin feedback hasta el final, como el examen real (≈73 seg/pregunta). Al terminar obtienes tu nota y una revisión pregunta a pregunta.</p>
      </button>
    </div>
  `));

  // Bloque 3: panel de configuración, oculto hasta que se elige un modo
  view.appendChild(el(`<div class="plate hidden" id="configPanel"></div>`));

  document.getElementById('goHistory').addEventListener('click', renderHistoryView);
  document.getElementById('goPractice').addEventListener('click', renderPracticeConfig);
  document.getElementById('goExam').addEventListener('click', ()=>renderExamConfig(examOptions));

/* ---------- HISTORIAL / RESULTADOS ---------- */
function renderHistoryView(){
  const ov = overallStats();
  view.innerHTML='';
  const back = el(`<button class="back-link">← Volver al panel</button>`);
  back.addEventListener('click', renderDashboard);
  view.appendChild(back);

  // Resumen global
  view.appendChild(el(`
    <div class="plate">
      <span class="eyebrow">Resultados e histórico</span>
      <h2>Tu progreso acumulado</h2>
      <div class="stat-grid">
        <div class="stat"><div class="n">${ov.attemptedQ}/${QUESTIONS.length}</div><div class="l">Preguntas practicadas</div></div>
        <div class="stat"><div class="n">${ov.seen? Math.round((ov.correct/ov.seen)*100):0}%</div><div class="l">Precisión global</div></div>
        <div class="stat"><div class="n">${STATS.exams.length}</div><div class="l">Exámenes completados</div></div>
      </div>
      <div class="coverage" style="margin-top:20px;">${coverageRowsHTML()}</div>
    </div>
  `));

  // Evolución de notas de examen
  if(STATS.exams.length){
    const last = STATS.exams.slice(-10);
    const bars = last.map(ex=>{
      const pct = Math.round((ex.score/ex.total)*100);
      return `<div style="display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;">
        <div style="font-family:var(--font-mono); font-size:10.5px; color:var(--text-on-ink-dim);">${pct}%</div>
        <div style="width:100%; max-width:34px; height:${Math.max(pct,4)}px; background:var(--amber); align-self:flex-end;"></div>
      </div>`;
    }).join('');
    view.appendChild(el(`
      <div class="plate">
        <span class="eyebrow">Evolución</span>
        <h2 style="font-size:16px;">Tus últimas ${last.length} notas de examen simulado</h2>
        <div style="display:flex; align-items:flex-end; gap:8px; height:130px; margin-top:20px; border-bottom:1px solid var(--grid); padding-bottom:0;">${bars}</div>
      </div>
    `));
  }

  // Copia de seguridad para mover el progreso entre dispositivos
  const backupPlate = el(`
    <div class="plate">
      <span class="eyebrow">Copia de seguridad</span>
      <h2 style="font-size:16px;">Llevar tu progreso a otro dispositivo</h2>
      <p class="sub">El progreso se guarda solo en este navegador y este dispositivo. Descarga una copia aquí y súbela en la app abierta en tu otro dispositivo (móvil ↔ ordenador) para mantener el mismo historial en ambos.</p>
      <button class="primary-btn" id="exportBtn">Descargar copia de mi progreso</button>
      <button class="ghost-btn" id="importBtn">Restaurar desde un archivo</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
  `);
  view.appendChild(backupPlate);
  backupPlate.querySelector('#exportBtn').addEventListener('click', exportProgress);
  backupPlate.querySelector('#importBtn').addEventListener('click', ()=>backupPlate.querySelector('#importFile').click());
  backupPlate.querySelector('#importFile').addEventListener('change', (e)=>{
    if(e.target.files[0]) importProgress(e.target.files[0]);
  });

  if(!STATS.exams.length){
    view.appendChild(el(`<div class="plate"><p class="history-empty">Todavía no has completado ningún examen simulado. Cuando termines uno, aparecerá aquí con tu nota y el desglose por dominio.</p></div>`));
    return;
  }

  const items = STATS.exams.slice().reverse().map(ex=>{
    const pct = Math.round((ex.score/ex.total)*100);
    const breakdown = ex.domainTally ? Object.entries(ex.domainTally).filter(([,v])=>v.t>0).map(([k,v])=>{
      const meta = DOMAIN_META[k];
      return `<span>${meta.label}: ${v.c}/${v.t}</span>`;
    }).join('') : '';
    return `<div class="stat" style="text-align:left;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:var(--font-mono); font-size:11.5px; color:var(--text-on-ink-dim);">${ex.date}</span>
        <span style="font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--amber);">${ex.score}/${ex.total} · ${pct}%</span>
      </div>
      <div class="domain-breakdown">${breakdown}</div>
    </div>`;
  }).join('');

  view.appendChild(el(`
    <div class="plate">
      <h2 style="font-size:16px;">Exámenes simulados completados (${STATS.exams.length})</h2>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">${items}</div>
    </div>
  `));
}

/* ---------- CONFIG: PRÁCTICA ---------- */
function renderPracticeConfig(){
  const panel = document.getElementById('configPanel');
  panel.classList.remove('hidden');
  panel.innerHTML = `
    <span class="eyebrow">Configurar práctica</span>
    <h2 style="font-size:17px;">¿Sobre qué dominio quieres practicar?</h2>
    <div class="field-row">
      <div class="field">
        <label>Dominio</label>
        <select id="domainSel">
          <option value="all">Los tres dominios</option>
          <option value="people">Personas (42%)</option>
          <option value="process">Proceso (50%)</option>
          <option value="business">Entorno de negocio (8%)</option>
        </select>
      </div>
      <div class="field">
        <label>Orden</label>
        <select id="orderSel">
          <option value="random">Aleatorio</option>
          <option value="weak">Priorizar mis fallos</option>
        </select>
      </div>
    </div>
    <button class="primary-btn" id="startPractice">Empezar práctica</button>
  `;
  panel.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('startPractice').addEventListener('click', ()=>{
    const domain = document.getElementById('domainSel').value;
    const order = document.getElementById('orderSel').value;
    let pool = QUESTIONS.filter(q=> domain==='all' || q.domain===domain);
    if(order==='weak'){
      pool = pool.sort((a,b)=>{
        const ra = STATS.attempts[a.id], rb = STATS.attempts[b.id];
        const scoreA = ra ? (ra.correct/ra.seen) : -1;
        const scoreB = rb ? (rb.correct/rb.seen) : -1;
        return scoreA - scoreB;
      });
    } else {
      pool = shuffle(pool);
    }
    startPractice(pool);
  });
}

        <select id="examCount">
          ${examOptions.map(n=>`<option value="${n}" ${n===60?'selected':''}>${n} preguntas</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Tiempo</label>
        <select id="examTime">
          <option value="real">Ritmo real (~73 s/pregunta)</option>
          <option value="loose">Relajado (120 s/pregunta)</option>
          <option value="none">Sin cronómetro</option>
        </select>
      </div>
    </div>
    <button class="primary-btn" id="startExam">Empezar examen</button>
  `;
  panel.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('startExam').addEventListener('click', ()=>{
    const count = parseInt(document.getElementById('examCount').value,10);
    const timeMode = document.getElementById('examTime').value;
    const secsPer = timeMode==='real' ? 73 : timeMode==='loose' ? 120 : 0;
    const pool = shuffle(QUESTIONS).slice(0,count);
    startExam(pool, secsPer);
  });
}

/* ============================================================
   MODO PRÁCTICA
   ============================================================ */
function startPractice(pool){
  let idx = 0;
  const total = pool.length;
  renderPracticeQuestion();

  function renderPracticeQuestion(){
    if(idx >= total){
      view.innerHTML='';
      view.appendChild(el(`<div class="plate score-hero"><h2>Sesión de práctica completada</h2><p class="sub" style="margin:10px auto 0;">Has repasado ${total} preguntas. Vuelve al panel para ver tu progreso actualizado por dominio.</p><button class="primary-btn" id="backHome">Volver al panel</button></div>`));
      document.getElementById('backHome').addEventListener('click', renderDashboard);
      return;
    }
    const item = pool[idx];
    const meta = DOMAIN_META[item.domain];
    view.innerHTML='';
    const card = el(`
      <div class="plate">
        <div class="qmeta">
          <div class="qmeta-left">
            <span class="domain-pill" style="background:${meta.color};">${meta.label}</span>
            <span>${item.topic}</span>
          </div>
          <span class="qmeta-left">Pregunta ${idx+1} / ${total}</span>
        </div>
        <div class="progress-bar"><i style="width:${(idx/total)*100}%;"></i></div>
        <div class="qtext">${item.q}</div>
        <div class="options" id="opts"></div>
        <div id="explainSlot"></div>
        <div class="qfooter"><span></span><button class="primary-btn hidden" id="nextBtn">Siguiente pregunta →</button></div>
      </div>
    `);
    view.appendChild(card);
    const optsWrap = card.querySelector('#opts');
    item.o.forEach((optText, i)=>{
      const btn = el(`<button class="option"><span class="k">${String.fromCharCode(65+i)}</span><span>${optText}</span></button>`);
      btn.addEventListener('click', ()=>answerPractice(item, i, card));
      optsWrap.appendChild(btn);
    });
  }

  function answerPractice(item, chosen, card){
    const opts = card.querySelectorAll('.option');
    opts.forEach((b,i)=>{
      b.disabled = true;
      if(i===item.a) b.classList.add('correct');
      else if(i===chosen) b.classList.add('incorrect');
    });
    const correct = chosen===item.a;
    recordAttempt(item.id, correct);
    saveStats();
    const slot = card.querySelector('#explainSlot');
    slot.innerHTML = `<div class="explain ${correct?'':'wrong-flag'}">
      <b class="${correct?'verdict-ok':'verdict-bad'}">${correct? '✓ Correcto' : '✕ Incorrecto — la respuesta correcta es ' + String.fromCharCode(65+item.a)}</b>
      ${item.e}
    </div>`;
    card.querySelector('#nextBtn').classList.remove('hidden');
    card.querySelector('#nextBtn').addEventListener('click', ()=>{ idx++; renderPracticeQuestion(); });
  }
}

/* ============================================================
   MODO EXAMEN SIMULADO
   ============================================================ */
function startExam(pool, secsPer){
  let idx = 0;
  const total = pool.length;
  const answers = new Array(total).fill(null);
  let timerInterval = null;
  let remaining = secsPer * total;

  renderExamQuestion();
  if(secsPer>0) startTimer();

  function startTimer(){
    timerInterval = setInterval(()=>{
      remaining--;
      const t = document.getElementById('examTimerDisplay');
      if(t) t.textContent = formatTime(remaining);
      if(remaining<=0){ clearInterval(timerInterval); finishExam(); }
    },1000);
  }
  function formatTime(s){
    if(s<0) s=0;
    const m = Math.floor(s/60), sec = s%60;
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  function renderExamQuestion(){
    const item = pool[idx];
    const meta = DOMAIN_META[item.domain];
    view.innerHTML='';
    const card = el(`
      <div class="plate">
        <div class="qmeta">
          <div class="qmeta-left">
            <span class="domain-pill" style="background:${meta.color};">${meta.label}</span>
          </div>
          <div class="qmeta-left">
            <span>Pregunta ${idx+1} / ${total}</span>
            ${secsPer>0? `<span class="timer" id="examTimerDisplay">${formatTime(remaining)}</span>`:''}
          </div>
        </div>
        <div class="progress-bar"><i style="width:${(idx/total)*100}%;"></i></div>
        <div class="qtext">${item.q}</div>
        <div class="options" id="opts"></div>
        <div class="qfooter">
          <button class="ghost-btn" id="prevBtn" ${idx===0?'disabled style="opacity:.3;"':''}>← Anterior</button>
          <button class="primary-btn" id="nextExamBtn">${idx===total-1? 'Finalizar examen' : 'Siguiente →'}</button>
        </div>
      </div>
    `);
    view.appendChild(card);
    const optsWrap = card.querySelector('#opts');
    item.o.forEach((optText,i)=>{
      const btn = el(`<button class="option ${answers[idx]===i?'selected':''}"><span class="k">${String.fromCharCode(65+i)}</span><span>${optText}</span></button>`);
      btn.addEventListener('click', ()=>{
        answers[idx]=i;
        optsWrap.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
        btn.classList.add('selected');
      });
      optsWrap.appendChild(btn);
    });
    card.querySelector('#nextExamBtn').addEventListener('click', ()=>{
      if(idx<total-1){ idx++; renderExamQuestion(); }
      else { if(timerInterval) clearInterval(timerInterval); finishExam(); }
    });
    if(idx>0) card.querySelector('#prevBtn').addEventListener('click', ()=>{ idx--; renderExamQuestion(); });
  }

  function finishExam(){
    let score = 0;
    const domainTally = { people:{c:0,t:0}, process:{c:0,t:0}, business:{c:0,t:0} };
    pool.forEach((item,i)=>{
      const correct = answers[i]===item.a;
      if(correct) score++;
      recordAttempt(item.id, correct);
      domainTally[item.domain].t++;
      if(correct) domainTally[item.domain].c++;
    });
    STATS.exams.push({ date:new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}), score, total, domainTally });
    saveStats();
    renderExamResults(pool, answers, score, total, domainTally);
  }
}

function renderExamResults(pool, answers, score, total, domainTally){
  const pct = Math.round((score/total)*100);
  view.innerHTML='';
  view.appendChild(el(`
    <div class="plate score-hero">
      <span class="eyebrow">Resultado del examen simulado</span>
      <div class="big">${pct}<small>%</small></div>
      <p>${score} de ${total} respuestas correctas</p>
    </div>
  `));
  const domRows = Object.entries(domainTally).filter(([,v])=>v.t>0).map(([k,v])=>{
    const meta = DOMAIN_META[k];
    const p = Math.round((v.c/v.t)*100);
    return `<div class="coverage-row"><div class="coverage-label"><span>${meta.label}</span></div>
      <div class="coverage-track"><div class="coverage-fill" style="width:${p}%; background:${meta.color};"></div></div>
      <div class="coverage-pct">${v.c}/${v.t}</div></div>`;
  }).join('');
  view.appendChild(el(`<div class="plate"><h2 style="font-size:16px;">Desglose por dominio</h2><div class="coverage" style="margin-top:14px;">${domRows}</div></div>`));

  const filterState = { mode:'all' };
  const reviewPlate = el(`<div class="plate">
    <span class="eyebrow">Revisión</span>
    <h2 style="font-size:16px; margin-bottom:14px;">Repaso pregunta a pregunta</h2>
    <div class="filter-row">
      <button class="chip active" data-f="all">Todas</button>
      <button class="chip" data-f="bad">Solo falladas</button>
      <button class="chip" data-f="ok">Solo correctas</button>
    </div>
    <div id="reviewList"></div>
  </div>`);
  view.appendChild(reviewPlate);
  view.appendChild(el(`<button class="primary-btn" id="backHome2">Volver al panel</button>`));
  document.getElementById('backHome2').addEventListener('click', renderDashboard);

  function drawList(){
    const list = reviewPlate.querySelector('#reviewList');
    list.innerHTML='';
    pool.forEach((item,i)=>{
      const correct = answers[i]===item.a;
      if(filterState.mode==='bad' && correct) return;
      if(filterState.mode==='ok' && !correct) return;
      const row = el(`<div class="review-item">
        <div class="row"><div class="q">${i+1}. ${item.q}</div><span class="verdict ${correct?'ok':'bad'}">${correct?'CORRECTA':'FALLADA'}</span></div>
        <div class="review-detail">
          <div class="options" style="margin-top:12px;">
            ${item.o.map((opt,j)=>`<div class="option" style="cursor:default; ${j===item.a?'border-color:var(--verified); background:rgba(63,167,150,.14);':''} ${j===answers[i] && j!==item.a?'border-color:var(--alert); background:rgba(226,87,76,.12);':''}"><span class="k">${String.fromCharCode(65+j)}</span><span>${opt}</span></div>`).join('')}
          </div>
          <div class="explain ${correct?'':'wrong-flag'}" style="margin-top:12px;">
            <b class="${correct?'verdict-ok':'verdict-bad'}">${correct? '✓ Correcto':'✕ Respuesta correcta: '+String.fromCharCode(65+item.a)}</b>
            ${item.e}
            ${ (answers[i]===null) ? '<div style="margin-top:8px; color:var(--text-on-paper-dim); font-size:13px;">No respondiste esta pregunta.</div>' : ''}
          </div>
        </div>
      </div>`);
      row.addEventListener('click', ()=>row.classList.toggle('open'));
      list.appendChild(row);
    });
  }
  reviewPlate.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      reviewPlate.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      filterState.mode = chip.dataset.f;
      drawList();
    });
  });
  drawList();
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  loadStats();
  renderDashboard();
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
