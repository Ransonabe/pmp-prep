<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Banco PMP — Preparación de examen (ECO 2026)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12253F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMP Prep">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    /* Chrome de la app (menús, home, resultados) */
    --ink:#12253F;
    --ink-2:#1B3255;
    --ink-3:#24406B;
    --grid:#2E4B78;
    --amber:#E3A34A;
    --verified:#4BA894;
    --alert:#D8635A;
    --txt:#E8EDF4;
    --txt-dim:#A2B3CC;
    --people:#C98BB6;
    --process:#5CA9D6;
    --business:#E3A34A;

    /* MODO PRÁCTICA: lectura prolongada, bajo deslumbramiento */
    --p-bg:#F2EEE4;          /* crema cálido, no blanco puro */
    --p-card:#FBF9F4;
    --p-txt:#2E2A24;         /* gris cálido oscuro, no negro puro */
    --p-txt-dim:#6A6259;
    --p-line:#DCD5C7;
    --p-accent:#8A6A3B;
    --p-ok-bg:#E4EFE4;
    --p-ok-line:#4E8B58;
    --p-bad-bg:#F6E4E1;
    --p-bad-line:#B4544A;

    /* MODO EXAMEN: réplica sobria del motor Pearson VUE */
    --x-bg:#FFFFFF;
    --x-bar:#F1F1F1;
    --x-bar-line:#C8C8C8;
    --x-txt:#1A1A1A;
    --x-txt-dim:#555555;
    --x-line:#B9B9B9;
    --x-sel:#DCE9F7;
    --x-sel-line:#2A6099;
    --x-blue:#1F5FA8;

    --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-read:Georgia,'Iowan Old Style','Times New Roman',serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--txt); font-family:var(--font-ui);
    min-height:100vh; line-height:1.55;
  }
  #app{max-width:900px;margin:0 auto;padding:16px 14px 60px;}
  .hidden{display:none !important;}
  button{font-family:inherit;}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- Topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:10px 0 16px;border-bottom:1px solid var(--grid);margin-bottom:20px;}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand .mark{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--amber);
    border:1px solid var(--amber);padding:2px 5px;border-radius:2px;}
  .brand h1{font-size:17px;font-weight:600;}
  .nav-btn{font-family:var(--font-mono);font-size:11.5px;background:none;border:1px solid var(--grid);
    color:var(--txt-dim);padding:7px 11px;cursor:pointer;border-radius:3px;}
  .nav-btn:hover{border-color:var(--amber);color:var(--txt);}

  /* ---------- Bloques ---------- */
  .plate{position:relative;background:var(--ink-2);border:1px solid var(--grid);padding:18px;margin-bottom:14px;border-radius:4px;}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--amber);margin-bottom:7px;display:block;}
  h2{font-size:20px;font-weight:600;margin-bottom:4px;}
  h3{font-size:15px;font-weight:600;}
  .sub{color:var(--txt-dim);font-size:13.5px;max-width:62ch;}

  .notice{background:rgba(227,163,74,.1);border:1px solid var(--amber);border-radius:4px;
    padding:13px 15px;margin-bottom:14px;font-size:13.5px;color:var(--txt);}
  .notice b{color:var(--amber);}

  /* ---------- Botones de modo ---------- */
  .lang-head{display:flex;align-items:center;gap:9px;margin:20px 0 10px;}
  .lang-head .flag{font-size:17px;}
  .lang-head h3{font-size:15px;letter-spacing:.01em;}
  .lang-head .line{flex:1;height:1px;background:var(--grid);}
  .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
  @media (max-width:700px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{background:var(--ink-2);border:1px solid var(--grid);border-radius:4px;padding:15px;
    cursor:pointer;text-align:left;color:var(--txt);transition:border-color .15s,transform .12s;}
  .mode-card:hover{border-color:var(--amber);transform:translateY(-1px);}
  .mode-card .tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;color:var(--amber);
    display:block;margin-bottom:6px;}
  .mode-card h4{font-size:14.5px;font-weight:600;margin-bottom:5px;}
  .mode-card p{font-size:12.5px;color:var(--txt-dim);line-height:1.45;}
  .mode-card .meter{margin-top:9px;height:3px;background:var(--ink);border-radius:2px;overflow:hidden;}
  .mode-card .meter i{display:block;height:100%;background:var(--amber);}
  .mode-card .meter-txt{font-family:var(--font-mono);font-size:10px;color:var(--txt-dim);margin-top:5px;}
  .results-btn{width:100%;background:var(--ink-3);border:1px solid var(--grid);border-radius:4px;
    padding:15px;cursor:pointer;color:var(--txt);text-align:left;display:flex;justify-content:space-between;
    align-items:center;gap:12px;}
  .results-btn:hover{border-color:var(--amber);}
  .results-btn .arrow{color:var(--amber);font-size:18px;}

  /* ---------- Config ---------- */
  .field-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:14px;}
  .field{flex:1;min-width:145px;}
  .field label{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--txt-dim);display:block;margin-bottom:5px;}
  select{width:100%;background:var(--ink);border:1px solid var(--grid);color:var(--txt);
    font-size:13.5px;padding:9px;border-radius:3px;font-family:inherit;}
  .primary-btn{font-size:14px;font-weight:600;background:var(--amber);color:#12253F;border:none;
    padding:12px 20px;cursor:pointer;margin-top:14px;border-radius:3px;}
  .primary-btn:hover{filter:brightness(1.07);}
  .ghost-btn{font-size:12.5px;background:none;border:1px solid var(--grid);color:var(--txt-dim);
    padding:11px 15px;cursor:pointer;margin-top:14px;margin-left:8px;border-radius:3px;}
  .ghost-btn:hover{color:var(--txt);border-color:var(--amber);}
  .back-link{font-family:var(--font-mono);font-size:11.5px;color:var(--txt-dim);background:none;
    border:none;cursor:pointer;margin-bottom:12px;padding:4px 0;}
  .back-link:hover{color:var(--amber);}

  /* ---------- Estadísticas ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .stat{border:1px solid var(--grid);border-radius:3px;padding:11px;text-align:center;}
  .stat .n{font-family:var(--font-mono);font-size:19px;font-weight:600;}
  .stat .l{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--txt-dim);margin-top:3px;line-height:1.3;}
  .stat .n.ok{color:var(--verified);} .stat .n.bad{color:var(--alert);} .stat .n.am{color:var(--amber);}
  .bar-row{margin-bottom:13px;}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-top .lbl{color:var(--txt);}
  .bar-top .val{font-family:var(--font-mono);font-size:11.5px;color:var(--txt-dim);}
  .bar-track{height:9px;background:var(--ink);border:1px solid var(--grid);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:700px){.split{grid-template-columns:1fr;}}
  .hist-item{border:1px solid var(--grid);border-radius:3px;padding:11px 13px;margin-bottom:8px;}
  .hist-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hist-date{font-family:var(--font-mono);font-size:11px;color:var(--txt-dim);}
  .hist-score{font-family:var(--font-mono);font-size:14.5px;font-weight:600;color:var(--amber);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .chips span{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border:1px solid var(--grid);
    border-radius:10px;color:var(--txt-dim);}
  .empty{color:var(--txt-dim);font-size:13.5px;padding:14px 0;}
  .spark{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:14px;
    border-bottom:1px solid var(--grid);}
  .spark .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;}
  .spark .col b{font-family:var(--font-mono);font-size:9.5px;font-weight:400;color:var(--txt-dim);}
  .spark .col i{display:block;width:100%;max-width:30px;background:var(--amber);}

  /* ============ MODO PRÁCTICA (lectura amigable) ============ */
  body.practice-mode{background:var(--p-bg);color:var(--p-txt);}
  body.practice-mode .topbar{border-bottom-color:var(--p-line);}
  body.practice-mode .brand h1{color:var(--p-txt);}
  body.practice-mode .brand .mark{color:var(--p-accent);border-color:var(--p-accent);}
  body.practice-mode .nav-btn{border-color:var(--p-line);color:var(--p-txt-dim);}
  body.practice-mode .nav-btn:hover{border-color:var(--p-accent);color:var(--p-txt);}
  .pr-wrap{background:var(--p-card);border:1px solid var(--p-line);border-radius:5px;padding:20px;}
  .pr-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:var(--font-mono);font-size:11px;color:var(--p-txt-dim);margin-bottom:12px;}
  .pr-pill{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;
    border-radius:10px;color:#2E2A24;font-weight:600;}
  .pr-progress{height:3px;background:var(--p-line);border-radius:2px;margin-bottom:18px;overflow:hidden;}
  .pr-progress i{display:block;height:100%;background:var(--p-accent);transition:width .25s;}
  .pr-q{font-family:var(--font-read);font-size:17.5px;line-height:1.68;color:var(--p-txt);margin-bottom:19px;}
  .pr-opts{display:flex;flex-direction:column;gap:9px;}
  .pr-opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    background:#FFFDF8;border:1px solid var(--p-line);border-radius:4px;padding:13px 14px;cursor:pointer;
    font-family:var(--font-read);font-size:15.5px;line-height:1.55;color:var(--p-txt);transition:border-color .12s;}
  .pr-opt:hover:not(:disabled){border-color:var(--p-accent);}
  .pr-opt .k{font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--p-txt-dim);
    border:1px solid var(--p-line);border-radius:3px;width:21px;height:21px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;margin-top:1px;}
  .pr-opt.correct{background:var(--p-ok-bg);border-color:var(--p-ok-line);}
  .pr-opt.correct .k{background:var(--p-ok-line);border-color:var(--p-ok-line);color:#fff;}
  .pr-opt.chosen-bad{background:var(--p-bad-bg);border-color:var(--p-bad-line);}
  .pr-opt.chosen-bad .k{background:var(--p-bad-line);border-color:var(--p-bad-line);color:#fff;}
  .pr-opt:disabled{cursor:default;}
  .pr-verdict{margin-top:18px;padding:13px 15px;border-radius:4px;font-size:14.5px;font-weight:600;}
  .pr-verdict.ok{background:var(--p-ok-bg);border-left:4px solid var(--p-ok-line);color:#2C5C35;}
  .pr-verdict.bad{background:var(--p-bad-bg);border-left:4px solid var(--p-bad-line);color:#8C3A31;}
  .pr-why{margin-top:12px;border:1px solid var(--p-line);border-radius:4px;overflow:hidden;}
  .pr-why-h{background:#EFEADE;padding:9px 14px;font-family:var(--font-mono);font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--p-txt-dim);}
  .pr-why-row{display:flex;gap:11px;padding:12px 14px;border-top:1px solid var(--p-line);
    font-size:14px;line-height:1.6;font-family:var(--font-read);}
  .pr-why-row .tick{font-family:var(--font-mono);font-size:11px;font-weight:700;flex-shrink:0;
    width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .pr-why-row.good .tick{background:var(--p-ok-line);color:#fff;}
  .pr-why-row.bad .tick{background:#C9C1B2;color:#fff;}
  .pr-ref{margin-top:11px;font-family:var(--font-mono);font-size:11px;color:var(--p-txt-dim);
    padding-top:10px;border-top:1px dashed var(--p-line);}
  .pr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;}
  .pr-next{font-size:14px;font-weight:600;background:var(--p-accent);color:#FBF9F4;border:none;
    padding:12px 20px;cursor:pointer;border-radius:3px;}
  .pr-quit{font-size:12.5px;background:none;border:1px solid var(--p-line);color:var(--p-txt-dim);
    padding:11px 14px;cursor:pointer;border-radius:3px;}

  /* ============ MODO EXAMEN (réplica Pearson VUE) ============ */
  body.exam-mode{background:var(--x-bg);color:var(--x-txt);}
  body.exam-mode #app{max-width:100%;padding:0;}
  .xm{min-height:100vh;display:flex;flex-direction:column;background:var(--x-bg);}
  .xm-head{background:var(--x-bar);border-bottom:1px solid var(--x-bar-line);
    padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:12.5px;color:var(--x-txt);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .xm-head .l{font-weight:600;}
  .xm-head .r{display:flex;align-items:center;gap:14px;}
  .xm-clock{font-family:var(--font-mono);font-size:13px;font-weight:600;}
  .xm-clock.warn{color:#B00020;}
  .xm-flagbtn{background:none;border:1px solid var(--x-line);border-radius:3px;padding:5px 10px;
    font-size:11.5px;cursor:pointer;color:var(--x-txt);}
  .xm-flagbtn.on{background:#FFF3CD;border-color:#D9A400;color:#7A5C00;font-weight:600;}
  .xm-bar{height:4px;background:#E0E0E0;}
  .xm-bar i{display:block;height:100%;background:var(--x-blue);transition:width .2s;}
  .xm-body{flex:1;padding:22px 18px 100px;max-width:860px;margin:0 auto;width:100%;}
  .xm-qnum{font-size:12px;color:var(--x-txt-dim);margin-bottom:9px;}
  .xm-q{font-size:15.5px;line-height:1.62;color:var(--x-txt);margin-bottom:8px;}
  .xm-hint{font-size:12.5px;color:var(--x-txt-dim);margin-bottom:16px;font-style:italic;}
  .xm-opts{display:flex;flex-direction:column;gap:2px;}
  .xm-opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:none;
    border:1px solid transparent;border-radius:3px;padding:11px 12px;cursor:pointer;
    font-size:14.5px;line-height:1.55;color:var(--x-txt);}
  .xm-opt:hover{background:#F5F8FC;}
  .xm-opt .radio{width:16px;height:16px;border:1px solid #767676;border-radius:50%;flex-shrink:0;
    margin-top:3px;position:relative;background:#fff;}
  .xm-opt .radio.sq{border-radius:3px;}
  .xm-opt.sel{background:var(--x-sel);border-color:var(--x-sel-line);}
  .xm-opt.sel .radio{border-color:var(--x-sel-line);}
  .xm-opt.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--x-sel-line);}
  .xm-opt.sel .radio.sq::after{border-radius:1px;}
  .xm-foot{position:fixed;bottom:0;left:0;right:0;background:var(--x-bar);
    border-top:1px solid var(--x-bar-line);padding:10px 14px;display:flex;justify-content:space-between;
    gap:8px;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  .xm-btn{background:#fff;border:1px solid #767676;border-radius:3px;padding:10px 15px;font-size:13px;
    cursor:pointer;color:var(--x-txt);min-width:88px;}
  .xm-btn:hover{background:#F0F4F9;}
  .xm-btn:disabled{opacity:.4;cursor:default;}
  .xm-btn.blue{background:var(--x-blue);border-color:var(--x-blue);color:#fff;font-weight:600;}
  .xm-btn.blue:hover{filter:brightness(1.08);}
  .xm-sum{max-width:860px;margin:0 auto;padding:22px 18px 110px;}
  .xm-sum h2{color:var(--x-txt);font-size:19px;margin-bottom:6px;}
  .xm-sum p{color:var(--x-txt-dim);font-size:13.5px;margin-bottom:16px;}
  .xm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--x-txt-dim);margin-bottom:14px;}
  .xm-legend i{display:inline-block;width:11px;height:11px;border:1px solid #999;margin-right:5px;vertical-align:-1px;}
  .xm-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;}
  .xm-cell{border:1px solid #999;background:#fff;border-radius:3px;padding:8px 2px;font-size:12px;
    cursor:pointer;font-family:var(--font-mono);color:var(--x-txt);}
  .xm-cell.answered{background:#DCE9F7;border-color:var(--x-sel-line);}
  .xm-cell.flagged{background:#FFF3CD;border-color:#D9A400;}
  .xm-cell.flagged.answered{background:linear-gradient(135deg,#DCE9F7 50%,#FFF3CD 50%);}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <div class="brand"><span class="mark">ECO 2026</span><h1>Banco PMP</h1></div>
    <button class="nav-btn" id="homeBtn">Inicio</button>
  </div>
  <div id="view"></div>
</div>

<script src="questions-es.js"></script>
<script src="questions-en.js"></script>
<script>
/* ================================================================
   CONFIGURACIÓN — ECO 2026 (vigente desde el 9 de julio de 2026)
   Pesos oficiales: People 33% · Process 41% · Business Environment 26%
   ================================================================ */
const BANKS = {
  es: (typeof QUESTIONS_ES !== 'undefined') ? QUESTIONS_ES : [],
  en: (typeof QUESTIONS_EN !== 'undefined') ? QUESTIONS_EN : []
};

const T = {
  es:{
    name:'Español', flag:'🇪🇸',
    practice:'Práctica aleatoria', practiceD:'Preguntas al azar de todo el banco, con corrección y razonamiento inmediato tras cada respuesta.',
    cont:'Continuar práctica', contD:'Recorre el banco sin repetir preguntas. Retoma exactamente donde lo dejaste la última vez.',
    exam:'Examen simulado', examD:'Interfaz y ritmo del examen real (77 s/pregunta). Sin corrección hasta el final.',
    domains:{people:'Personas',process:'Proceso',business:'Entorno de negocio'}
  },
  en:{
    name:'English', flag:'🇬🇧',
    practice:'Random practice', practiceD:'Random questions from the whole bank, with instant scoring and full reasoning after each answer.',
    cont:'Continue practice', contD:'Work through the bank with no repeats. Picks up exactly where you left off.',
    exam:'Mock exam', examD:'Real exam interface and pacing (77 s/question). No feedback until the end.',
    domains:{people:'People',process:'Process',business:'Business Environment'}
  }
};

const DOMAINS = {
  people:  {weight:33, color:'var(--people)'},
  process: {weight:41, color:'var(--process)'},
  business:{weight:26, color:'var(--business)'}
};

const SECS_PER_Q = 77; // 230 min / 180 preguntas del examen real

/* ================================================================
   PERSISTENCIA
   ================================================================ */
const STORAGE_KEY = 'pmp-prep-v2';
let DB = null;

function blankLang(){ return {attempts:{}, exams:[], cycle:[], cycleStarted:null}; }
function loadDB(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); DB = raw ? JSON.parse(raw) : null; }
  catch(e){ DB = null; }
  if(!DB) DB = {};
  ['es','en'].forEach(l=>{ if(!DB[l]) DB[l] = blankLang(); 
    if(!DB[l].attempts) DB[l].attempts={}; if(!DB[l].exams) DB[l].exams=[];
    if(!DB[l].cycle) DB[l].cycle=[]; });
  // migración desde v1 (banco español antiguo)
  try{
    const old = localStorage.getItem('pmp-exam-prep-stats-v1');
    if(old && !DB._migrated){
      const o = JSON.parse(old);
      if(o && o.attempts) DB.es.legacy = {attempts:Object.keys(o.attempts).length, exams:(o.exams||[]).length};
      DB._migrated = true;
    }
  }catch(e){}
  return DB;
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){
    console.error(e);
    alert('No se ha podido guardar el progreso. Si estás en navegación privada/incógnito, cámbialo a modo normal.');
  }
}
function recordAttempt(lang, qid, correct){
  const a = DB[lang].attempts[qid] || {seen:0, correct:0};
  a.seen++; if(correct) a.correct++;
  DB[lang].attempts[qid] = a;
  if(!DB[lang].cycle.includes(qid)) DB[lang].cycle.push(qid);
}
function exportProgress(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='pmp-progreso-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importProgress(file){
  const r = new FileReader();
  r.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!d.es && !d.en) throw new Error('bad');
      DB = d; ['es','en'].forEach(l=>{ if(!DB[l]) DB[l]=blankLang(); });
      saveDB(); alert('Progreso importado correctamente.'); renderResults();
    }catch(err){ alert('Ese archivo no es una copia de progreso válida.'); }
  };
  r.readAsText(file);
}

/* ================================================================
   ESTADÍSTICAS
   ================================================================ */
function langStats(lang){
  const bank = BANKS[lang], att = DB[lang].attempts;
  let answered=0, correct=0, seenTotal=0;
  const ids = new Set(bank.map(q=>q.id));
  Object.entries(att).forEach(([id,r])=>{
    if(!ids.has(id)) return;
    answered++; correct += r.correct; seenTotal += r.seen;
  });
  return {
    bankSize: bank.length,
    distinct: answered,                    // preguntas distintas contestadas
    coverage: bank.length ? Math.round(answered/bank.length*100) : 0,
    responses: seenTotal,                  // respuestas totales (con repeticiones)
    correct, wrong: seenTotal-correct,
    accuracy: seenTotal ? Math.round(correct/seenTotal*100) : 0,
    exams: DB[lang].exams.length
  };
}
function domainStats(lang, dom){
  const ids = BANKS[lang].filter(q=>q.domain===dom).map(q=>q.id);
  let seen=0, correct=0, distinct=0;
  ids.forEach(id=>{ const r=DB[lang].attempts[id]; if(r){ seen+=r.seen; correct+=r.correct; distinct++; } });
  return {total:ids.length, distinct, seen, correct, wrong:seen-correct,
    accuracy: seen?Math.round(correct/seen*100):0,
    coverage: ids.length?Math.round(distinct/ids.length*100):0};
}
function remainingInCycle(lang){
  const done = new Set(DB[lang].cycle);
  return BANKS[lang].filter(q=>!done.has(q.id));
}

/* ================================================================
   MOTOR DE PRÁCTICA
   ================================================================ */
function startPractice(lang, pool, kind){
  let i=0, hits=0;
  const isES = lang==='es';
  setSkin('practice');
  draw();

  function draw(){
    if(i>=pool.length){ finish(); return; }
    const q=pool[i], t=T[lang], d=DOMAINS[q.domain];
    const multi = Array.isArray(q.a);
    setSkin('practice');
    view.innerHTML='';
    const card = el(`
      <div class="pr-wrap">
        <div class="pr-meta">
          <span><span class="pr-pill" style="background:${d.color}">${t.domains[q.domain]}</span>
          &nbsp;${esc(q.topic)}</span>
          <span>${i+1} / ${pool.length} · ${isES?'aciertos':'correct'} ${hits}</span>
        </div>
        <div class="pr-progress"><i style="width:${i/pool.length*100}%"></i></div>
        <div class="pr-q">${esc(q.q)}</div>
        ${multi?`<div class="xm-hint" style="color:var(--p-txt-dim);margin-bottom:12px;">${isES?'Selecciona '+q.a.length+' respuestas.':'Choose '+q.a.length+' answers.'}</div>`:''}
        <div class="pr-opts" id="opts"></div>
        <div id="slot"></div>
        <div class="pr-foot">
          <button class="pr-quit" id="quit">${isES?'Salir al inicio':'Exit to home'}</button>
          <button class="pr-next hidden" id="next">${isES?'Siguiente →':'Next →'}</button>
        </div>
      </div>`);
    view.appendChild(card);
    card.querySelector('#quit').addEventListener('click',()=>{ setSkin('home'); renderHome(); });

    const wrap = card.querySelector('#opts');
    let picked = [];
    q.o.forEach((txt,k)=>{
      const b = el(`<button class="pr-opt"><span class="k">${String.fromCharCode(65+k)}</span><span>${esc(txt)}</span></button>`);
      b.addEventListener('click',()=>{
        if(!multi){ answer([k],card,q); return; }
        const at = picked.indexOf(k);
        if(at>=0){ picked.splice(at,1); b.classList.remove('correct'); }
        else { if(picked.length>=q.a.length) return; picked.push(k); b.classList.add('correct'); }
        const cf = card.querySelector('#confirm');
        if(cf) cf.disabled = picked.length!==q.a.length;
      });
      wrap.appendChild(b);
    });
    if(multi){
      const cf = el(`<button class="pr-next" id="confirm" style="margin-top:14px;" disabled>${isES?'Confirmar':'Confirm'}</button>`);
      cf.addEventListener('click',()=>answer(picked,card,q));
      wrap.parentNode.insertBefore(cf, card.querySelector('#slot'));
    }
  }

  function answer(picked, card, q){
    const correctSet = Array.isArray(q.a)?q.a:[q.a];
    const ok = picked.length===correctSet.length && picked.every(p=>correctSet.includes(p));
    if(ok) hits++;
    recordAttempt(lang,q.id,ok); saveDB();

    const cf=card.querySelector('#confirm'); if(cf) cf.remove();
    card.querySelectorAll('.pr-opt').forEach((b,k)=>{
      b.disabled=true; b.classList.remove('correct','chosen-bad');
      if(correctSet.includes(k)) b.classList.add('correct');
      else if(picked.includes(k)) b.classList.add('chosen-bad');
    });

    const letters = correctSet.map(x=>String.fromCharCode(65+x)).join(', ');
    const rows = q.o.map((txt,k)=>{
      const good = correctSet.includes(k);
      return `<div class="pr-why-row ${good?'good':'bad'}">
        <span class="tick">${String.fromCharCode(65+k)}</span>
        <span><b>${good?(isES?'Correcta':'Correct'):(isES?'Incorrecta':'Incorrect')}.</b> ${esc(q.r[k])}</span>
      </div>`;
    }).join('');

    card.querySelector('#slot').innerHTML = `
      <div class="pr-verdict ${ok?'ok':'bad'}">
        ${ok?(isES?'✓ Correcto':'✓ Correct'):(isES?'✕ Incorrecto — la respuesta correcta es '+letters:'✕ Incorrect — the correct answer is '+letters)}
      </div>
      <div class="pr-why">
        <div class="pr-why-h">${isES?'Por qué cada opción es o no correcta':'Why each option is or is not correct'}</div>
        ${rows}
      </div>
      ${q.ref?`<div class="pr-ref">${isES?'Referencia':'Reference'}: ${esc(q.ref)}</div>`:''}`;

    const n=card.querySelector('#next');
    n.classList.remove('hidden');
    n.addEventListener('click',()=>{ i++; draw(); });
    n.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function finish(){
    setSkin('home');
    const pct = Math.round(hits/pool.length*100);
    view.innerHTML='';
    view.appendChild(el(`<div class="plate" style="text-align:center;">
      <span class="eyebrow">${isES?'Sesión completada':'Session complete'}</span>
      <h2>${hits} / ${pool.length} · ${pct}%</h2>
      <p class="sub" style="margin:8px auto 0;">${kind==='cycle'
        ? (isES?'Estas preguntas ya no volverán a aparecer en «Continuar práctica» hasta que reinicies el ciclo.'
               :'These questions will not reappear in "Continue practice" until you reset the cycle.')
        : (isES?'Tu progreso se ha guardado.':'Your progress has been saved.')}</p>
      <button class="primary-btn" id="h1">${isES?'Volver al inicio':'Back to home'}</button>
      <button class="ghost-btn" id="h2">${isES?'Ver estadísticas':'View statistics'}</button>
    </div>`));
    document.getElementById('h1').addEventListener('click',renderHome);
    document.getElementById('h2').addEventListener('click',renderResults);
  }
}

/* Selección ponderada según ECO 2026 */
function buildWeightedSet(lang, n){
  const out=[];
  const order=['process','people','business'];
  const byDom={};
  order.forEach(d=>byDom[d]=shuffle(BANKS[lang].filter(q=>q.domain===d)));
  const want={};
  order.forEach(d=>want[d]=Math.round(n*DOMAINS[d].weight/100));
  order.forEach(d=>{ out.push(...byDom[d].slice(0,want[d])); });
  // completar si falta por escasez en algún dominio
  if(out.length<n){
    const used=new Set(out.map(q=>q.id));
    const rest=shuffle(BANKS[lang].filter(q=>!used.has(q.id)));
    out.push(...rest.slice(0,n-out.length));
  }
  return shuffle(out).slice(0,n);
}

/* ================================================================
   MOTOR DE EXAMEN (réplica Pearson VUE)
   ================================================================ */
function startExam(lang, pool, timed){
  const isES=lang==='es', total=pool.length;
  const answers=new Array(total).fill(null);
  const flags=new Array(total).fill(false);
  let i=0, remaining=SECS_PER_Q*total, tick=null, onSummary=false;

  setSkin('exam');
  if(timed) tick=setInterval(()=>{
    remaining--;
    const c=document.getElementById('xClock');
    if(c){ c.textContent=fmtTime(remaining); if(remaining<300)c.classList.add('warn'); }
    if(remaining<=0){ clearInterval(tick); finish(); }
  },1000);

  drawQ();

  function chrome(inner){
    return `<div class="xm">
      <div class="xm-head">
        <span class="l">${isES?'Examen PMP — simulacro':'PMP Exam — mock'}</span>
        <span class="r">
          ${timed?`<span class="xm-clock" id="xClock">${fmtTime(remaining)}</span>`:''}
          <button class="xm-flagbtn" id="flagBtn"></button>
        </span>
      </div>
      <div class="xm-bar"><i style="width:${(i)/total*100}%"></i></div>
      ${inner}
    </div>`;
  }

  function drawQ(){
    onSummary=false;
    const q=pool[i], multi=Array.isArray(q.a);
    view.innerHTML='';
    const node = el(chrome(`
      <div class="xm-body">
        <div class="xm-qnum">${isES?'Pregunta':'Question'} ${i+1} ${isES?'de':'of'} ${total}</div>
        <div class="xm-q">${esc(q.q)}</div>
        <div class="xm-hint">${multi?(isES?'Elige '+q.a.length+' respuestas.':'Choose '+q.a.length+' answers.'):(isES?'Elige la mejor respuesta.':'Choose the best answer.')}</div>
        <div class="xm-opts" id="xo"></div>
      </div>
      <div class="xm-foot">
        <button class="xm-btn" id="prev" ${i===0?'disabled':''}>${isES?'Anterior':'Previous'}</button>
        <button class="xm-btn" id="sum">${isES?'Resumen':'Summary'}</button>
        <button class="xm-btn blue" id="next">${i===total-1?(isES?'Finalizar':'Finish'):(isES?'Siguiente':'Next')}</button>
      </div>`));
    view.appendChild(node);

    const fb=node.querySelector('#flagBtn');
    const paintFlag=()=>{ fb.textContent = flags[i]?(isES?'⚑ Marcada':'⚑ Flagged'):(isES?'⚑ Marcar':'⚑ Flag'); fb.classList.toggle('on',flags[i]); };
    paintFlag();
    fb.addEventListener('click',()=>{ flags[i]=!flags[i]; paintFlag(); });

    const box=node.querySelector('#xo');
    q.o.forEach((txt,k)=>{
      const cur=answers[i];
      const on = multi ? Array.isArray(cur)&&cur.includes(k) : cur===k;
      const b=el(`<button class="xm-opt ${on?'sel':''}"><span class="radio ${multi?'sq':''}"></span><span>${esc(txt)}</span></button>`);
      b.addEventListener('click',()=>{
        if(multi){
          let cur = Array.isArray(answers[i])?answers[i].slice():[];
          const at=cur.indexOf(k);
          if(at>=0) cur.splice(at,1);
          else { if(cur.length>=q.a.length) return; cur.push(k); }
          answers[i]=cur.length?cur:null;
        } else answers[i]=k;
        drawQ();
      });
      box.appendChild(b);
    });

    node.querySelector('#next').addEventListener('click',()=>{
      if(i<total-1){ i++; drawQ(); } else drawSummary();
    });
    node.querySelector('#sum').addEventListener('click',drawSummary);
    if(i>0) node.querySelector('#prev').addEventListener('click',()=>{ i--; drawQ(); });
  }

  function drawSummary(){
    onSummary=true;
    const answered = answers.filter(a=>a!==null).length;
    view.innerHTML='';
    const node = el(chrome(`
      <div class="xm-sum">
        <h2>${isES?'Resumen del examen':'Exam summary'}</h2>
        <p>${isES?`Has respondido ${answered} de ${total} preguntas. Toca cualquier número para volver a esa pregunta.`
                 :`You have answered ${answered} of ${total} questions. Tap any number to return to that question.`}</p>
        <div class="xm-legend">
          <span><i style="background:#DCE9F7;border-color:#2A6099;"></i>${isES?'Respondida':'Answered'}</span>
          <span><i style="background:#fff;"></i>${isES?'Sin responder':'Unanswered'}</span>
          <span><i style="background:#FFF3CD;border-color:#D9A400;"></i>${isES?'Marcada':'Flagged'}</span>
        </div>
        <div class="xm-nav" id="grid"></div>
      </div>
      <div class="xm-foot">
        <button class="xm-btn" id="back">${isES?'Volver':'Back'}</button>
        <button class="xm-btn blue" id="submit">${isES?'Entregar examen':'Submit exam'}</button>
      </div>`));
    view.appendChild(node);
    const g=node.querySelector('#grid');
    pool.forEach((_,k)=>{
      const c=el(`<button class="xm-cell ${answers[k]!==null?'answered':''} ${flags[k]?'flagged':''}">${k+1}</button>`);
      c.addEventListener('click',()=>{ i=k; drawQ(); });
      g.appendChild(c);
    });
    node.querySelector('#back').addEventListener('click',()=>drawQ());
    node.querySelector('#submit').addEventListener('click',()=>{
      const miss=total-answers.filter(a=>a!==null).length;
      const msg = miss>0
        ? (isES?`Quedan ${miss} preguntas sin responder. ¿Entregar de todos modos?`:`${miss} questions are unanswered. Submit anyway?`)
        : (isES?'¿Entregar el examen?':'Submit the exam?');
      if(confirm(msg)){ if(tick)clearInterval(tick); finish(); }
    });
  }

  function finish(){
    let score=0;
    const tally={people:{c:0,t:0},process:{c:0,t:0},business:{c:0,t:0}};
    pool.forEach((q,k)=>{
      const cs=Array.isArray(q.a)?q.a:[q.a];
      const g=answers[k];
      const got = g===null ? [] : (Array.isArray(g)?g:[g]);
      const ok = got.length===cs.length && got.every(x=>cs.includes(x));
      if(ok) score++;
      recordAttempt(lang,q.id,ok);
      tally[q.domain].t++; if(ok) tally[q.domain].c++;
    });
    DB[lang].exams.push({
      date:new Date().toLocaleDateString(lang==='es'?'es-ES':'en-GB',{day:'2-digit',month:'short',year:'numeric'}),
      score, total, tally, timed
    });
    saveDB();
    examReport(lang,pool,answers,score,total,tally);
  }
}

/* ================================================================
   INFORME DE EXAMEN
   ================================================================ */
function examReport(lang,pool,answers,score,total,tally){
  setSkin('practice');
  const isES=lang==='es', pct=Math.round(score/total*100);
  view.innerHTML='';
  const head = el(`<div class="pr-wrap" style="text-align:center;">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-txt-dim);">
      ${isES?'Resultado del simulacro':'Mock exam result'}</div>
    <div style="font-family:var(--font-mono);font-size:46px;font-weight:600;color:var(--p-accent);margin:6px 0;">${pct}<span style="font-size:20px;">%</span></div>
    <div style="color:var(--p-txt-dim);font-size:13.5px;">${score} / ${total} ${isES?'correctas':'correct'}</div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      ${Object.entries(tally).filter(([,v])=>v.t).map(([k,v])=>
        `<span style="font-family:var(--font-mono);font-size:11px;border:1px solid var(--p-line);border-radius:12px;padding:3px 9px;color:var(--p-txt-dim);">
        ${T[lang].domains[k]}: ${v.c}/${v.t}</span>`).join('')}
    </div>
  </div>`);
  view.appendChild(head);

  const list = el(`<div class="pr-wrap" style="margin-top:14px;">
    <div class="pr-why-h" style="margin:-20px -20px 14px;">${isES?'Revisión pregunta a pregunta':'Question-by-question review'}</div>
    <div id="rv"></div></div>`);
  view.appendChild(list);
  const rv=list.querySelector('#rv');

  pool.forEach((q,k)=>{
    const cs=Array.isArray(q.a)?q.a:[q.a];
    const g=answers[k]; const got=g===null?[]:(Array.isArray(g)?g:[g]);
    const ok=got.length===cs.length && got.every(x=>cs.includes(x));
    const item=el(`<div style="border:1px solid var(--p-line);border-radius:4px;padding:12px 14px;margin-bottom:9px;cursor:pointer;background:#FFFDF8;">
      <div style="display:flex;gap:10px;justify-content:space-between;align-items:flex-start;">
        <span style="font-family:var(--font-read);font-size:14px;line-height:1.5;">${k+1}. ${esc(q.q.slice(0,110))}${q.q.length>110?'…':''}</span>
        <span style="font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:3px;flex-shrink:0;
          background:${ok?'var(--p-ok-line)':'var(--p-bad-line)'};color:#fff;">${ok?(isES?'OK':'OK'):(isES?'FALLO':'WRONG')}</span>
      </div>
      <div class="det hidden" style="margin-top:12px;"></div>
    </div>`);
    const det=item.querySelector('.det');
    det.innerHTML = `<div class="pr-q" style="font-size:15px;margin-bottom:12px;">${esc(q.q)}</div>
      <div class="pr-why"><div class="pr-why-h">${isES?'Por qué cada opción es o no correcta':'Why each option is or is not correct'}</div>
      ${q.o.map((txt,z)=>{
        const good=cs.includes(z), chosen=got.includes(z);
        return `<div class="pr-why-row ${good?'good':'bad'}">
          <span class="tick">${String.fromCharCode(65+z)}</span>
          <span><b>${esc(txt)}</b><br><b>${good?(isES?'Correcta':'Correct'):(isES?'Incorrecta':'Incorrect')}${chosen?(isES?' — tu elección':' — your choice'):''}.</b> ${esc(q.r[z])}</span></div>`;
      }).join('')}</div>
      ${q.ref?`<div class="pr-ref">${isES?'Referencia':'Reference'}: ${esc(q.ref)}</div>`:''}`;
    item.addEventListener('click',()=>det.classList.toggle('hidden'));
    rv.appendChild(item);
  });

  const b=el(`<button class="pr-next" style="margin-top:14px;">${isES?'Volver al inicio':'Back to home'}</button>`);
  b.addEventListener('click',renderHome);
  view.appendChild(b);
}

/* ================================================================
   RESULTADOS Y ESTADÍSTICAS
   ================================================================ */
function renderResults(){
  setSkin('home');
  view.innerHTML='';
  const back=el(`<button class="back-link">← Volver al inicio</button>`);
  back.addEventListener('click',renderHome);
  view.appendChild(back);

  const es=langStats('es'), en=langStats('en');
  const gAns=es.responses+en.responses, gOk=es.correct+en.correct, gBad=es.wrong+en.wrong;
  const gEx=es.exams+en.exams;

  // 1) GLOBAL
  view.appendChild(el(`
    <div class="plate">
      <span class="eyebrow">1 · Global (ambos idiomas)</span>
      <h2>Resumen general</h2>
      <div class="stat-grid">
        <div class="stat"><div class="n">${gAns}</div><div class="l">Respuestas totales</div></div>
        <div class="stat"><div class="n ok">${gOk}</div><div class="l">Aciertos</div></div>
        <div class="stat"><div class="n bad">${gBad}</div><div class="l">Fallos</div></div>
      </div>
      <div class="stat-grid" style="margin-top:10px;">
        <div class="stat"><div class="n am">${gAns?Math.round(gOk/gAns*100):0}%</div><div class="l">Precisión global</div></div>
        <div class="stat"><div class="n">${gEx}</div><div class="l">Exámenes hechos</div></div>
        <div class="stat"><div class="n">${es.distinct+en.distinct}/${es.bankSize+en.bankSize}</div><div class="l">Banco cubierto</div></div>
      </div>
    </div>`));

  // 2) POR IDIOMA
  view.appendChild(el(`<div class="lang-head"><h3>2 · Desglose por idioma</h3><span class="line"></span></div>`));
  const split=el(`<div class="split"></div>`);
  [['es',es],['en',en]].forEach(([lang,s])=>{
    const t=T[lang];
    split.appendChild(el(`
      <div class="plate" style="margin-bottom:0;">
        <span class="eyebrow">${t.flag} ${t.name}</span>
        <h3 style="margin-bottom:12px;">${s.accuracy}% de aciertos</h3>
        <div class="bar-row">
          <div class="bar-top"><span class="lbl">Banco contestado</span>
            <span class="val">${s.distinct}/${s.bankSize} · ${s.coverage}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${s.coverage}%;background:var(--amber);"></div></div>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="n">${s.responses}</div><div class="l">Contestadas<br>(todos los modos)</div></div>
          <div class="stat"><div class="n ok">${s.correct}</div><div class="l">Aciertos</div></div>
          <div class="stat"><div class="n bad">${s.wrong}</div><div class="l">Fallos</div></div>
        </div>
        <div class="stat-grid" style="margin-top:9px;">
          <div class="stat"><div class="n">${s.exams}</div><div class="l">Exámenes</div></div>
          <div class="stat"><div class="n">${BANKS[lang].length-remainingInCycle(lang).length}/${s.bankSize}</div><div class="l">Ciclo actual</div></div>
          <div class="stat"><div class="n am">${s.accuracy}%</div><div class="l">Precisión</div></div>
        </div>
      </div>`));
  });
  view.appendChild(split);

  // 3) POR DOMINIO
  view.appendChild(el(`<div class="lang-head"><h3>3 · Por dominio (pesos ECO 2026)</h3><span class="line"></span></div>`));
  const dsplit=el(`<div class="split"></div>`);
  ['es','en'].forEach(lang=>{
    const t=T[lang];
    const rows=Object.entries(DOMAINS).map(([k,v])=>{
      const d=domainStats(lang,k);
      return `<div class="bar-row">
        <div class="bar-top"><span class="lbl">${t.domains[k]} <span style="color:var(--txt-dim);font-size:11px;">· ${v.weight}%</span></span>
          <span class="val">${d.seen?d.accuracy+'% · '+d.correct+'/'+d.seen:'—'}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.accuracy}%;background:${v.color};"></div></div>
        <div style="font-size:11px;color:var(--txt-dim);margin-top:4px;font-family:var(--font-mono);">
          ${d.distinct}/${d.total} vistas · ${d.wrong} fallos</div>
      </div>`;
    }).join('');
    dsplit.appendChild(el(`<div class="plate" style="margin-bottom:0;">
      <span class="eyebrow">${t.flag} ${t.name}</span>${rows}</div>`));
  });
  view.appendChild(dsplit);

  // 4) EVOLUCIÓN + HISTÓRICO
  const allEx=[...DB.es.exams.map(e=>({...e,lang:'es'})),...DB.en.exams.map(e=>({...e,lang:'en'}))];
  if(allEx.length){
    const last=allEx.slice(-12);
    view.appendChild(el(`<div class="plate">
      <span class="eyebrow">4 · Evolución</span>
      <h3>Últimos ${last.length} exámenes</h3>
      <div class="spark">${last.map(e=>{
        const p=Math.round(e.score/e.total*100);
        return `<div class="col"><b>${p}</b><i style="height:${Math.max(p*0.72,3)}px;background:${e.lang==='es'?'var(--amber)':'var(--process)'}"></i></div>`;
      }).join('')}</div>
      <div class="chips" style="margin-top:9px;">
        <span style="border-color:var(--amber);color:var(--amber);">🇪🇸 Español</span>
        <span style="border-color:var(--process);color:var(--process);">🇬🇧 English</span></div>
    </div>`));

    view.appendChild(el(`<div class="plate">
      <span class="eyebrow">5 · Histórico completo</span>
      <h3 style="margin-bottom:12px;">${allEx.length} exámenes registrados</h3>
      ${allEx.slice().reverse().map(e=>{
        const p=Math.round(e.score/e.total*100);
        return `<div class="hist-item">
          <div class="hist-top">
            <span class="hist-date">${T[e.lang].flag} ${e.date} · ${e.total} ${e.lang==='es'?'preguntas':'questions'}</span>
            <span class="hist-score">${e.score}/${e.total} · ${p}%</span></div>
          <div class="chips">${Object.entries(e.tally||{}).filter(([,v])=>v.t).map(([k,v])=>
            `<span>${T[e.lang].domains[k]}: ${v.c}/${v.t}</span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>`));
  } else {
    view.appendChild(el(`<div class="plate"><p class="empty">Todavía no has completado ningún examen simulado. Cuando termines uno, aparecerá aquí con su desglose.</p></div>`));
  }

  // 6) COPIA DE SEGURIDAD
  const bk=el(`<div class="plate">
    <span class="eyebrow">6 · Copia de seguridad</span>
    <h3>Llevar tu progreso a otro dispositivo</h3>
    <p class="sub" style="margin-top:5px;">El progreso vive solo en este navegador. Descarga una copia y restáurala en tu otro dispositivo para igualar el historial.</p>
    <button class="primary-btn" id="exp">Descargar copia</button>
    <button class="ghost-btn" id="imp">Restaurar copia</button>
    <input type="file" id="impf" accept="application/json" class="hidden">
    <button class="ghost-btn" id="rst" style="border-color:var(--alert);color:var(--alert);">Borrar todo el progreso</button>
  </div>`);
  view.appendChild(bk);
  bk.querySelector('#exp').addEventListener('click',exportProgress);
  bk.querySelector('#imp').addEventListener('click',()=>bk.querySelector('#impf').click());
  bk.querySelector('#impf').addEventListener('change',e=>{ if(e.target.files[0]) importProgress(e.target.files[0]); });
  bk.querySelector('#rst').addEventListener('click',()=>{
    if(confirm('Esto borrará TODO tu progreso en ambos idiomas de forma permanente. ¿Continuar?')){
      DB={es:blankLang(),en:blankLang()}; saveDB(); renderResults();
    }
  });
}

/* ================================================================
   ARRANQUE
   ================================================================ */
(function boot(){
  loadDB();
  renderHome();
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
